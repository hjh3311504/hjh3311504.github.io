review:
  type: expert
  summary: 결과 복사, 참가자 통계 dialog, 오늘 기록 지우기, 당첨자 영역 분리, 돌림판 우측 당첨자 목록, 기록 보기 전체 통계, 순위 색 단계를 반영했다. 적대적 리뷰로 찾은 누락 8건(오늘 기록 지우기 확인 문구의 되돌림 가능성, 복사 실패 대체 수단, 두 통계의 빈 상태, 오늘 기록 지운 시각 저장값, 옛 기록 순위 복구, 당첨자 목록 표시 조건, 회전 중 dialog 닫기)을 문서에 보완했다. 관리자 도구가 아닌 1인용 소비자 도구라 업무 queue 항목은 해당하지 않는다.
