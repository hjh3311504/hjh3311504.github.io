<script type="text/x-dc" data-dc-script data-props="{}">
const TKEY = 'juno.develog.theme';
const PKEY = 'juno.develog.sidebar-pinned';
const ORDER = ['auto', 'light', 'dark'];
const LABEL = { auto: '자동', light: '밝게', dark: '어둡게' };
const FOCUSABLE = 'a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])';

class Component extends DCLogic {
  menuRef = React.createRef();
  drawerRef = React.createRef();
  state = { theme: 'auto', pinned: true, wide: true, drawer: false };

  componentDidMount() {
    let theme = 'auto';
    let pinned = true;
    try {
      const t = localStorage.getItem(TKEY);
      if (ORDER.indexOf(t) >= 0) theme = t;
      pinned = localStorage.getItem(PKEY) !== '0';
    } catch (e) {}
    this.mq = window.matchMedia('(min-width: 1201px)');
    this.onMQ = () => this.setState({ wide: this.mq.matches, drawer: false });
    if (this.mq.addEventListener) this.mq.addEventListener('change', this.onMQ);
    else this.mq.addListener(this.onMQ);
    this.onKey = (e) => { if (e.key === 'Escape' && this.state.drawer) this.closeDrawer(); };
    window.addEventListener('keydown', this.onKey);
    this.setState({ theme, pinned, wide: this.mq.matches }, () => this.paintBody());
  }

  componentWillUnmount() {
    if (this.mq) {
      if (this.mq.removeEventListener) this.mq.removeEventListener('change', this.onMQ);
      else this.mq.removeListener(this.onMQ);
    }
    window.removeEventListener('keydown', this.onKey);
    document.body.style.overflowY = '';
    document.body.style.position = '';
    document.body.style.top = '';
  }

  _lastTheme = 'auto';
  _lastDrawer = false;

  componentDidUpdate() {
    if (this._lastTheme !== this.state.theme) {
      this._lastTheme = this.state.theme;
      this.paintBody();
    }
    if (this._lastDrawer !== this.state.drawer) {
      this._lastDrawer = this.state.drawer;
      if (this.state.drawer) {
        document.body.style.overflowY = 'scroll';
        document.body.style.overflowX = 'hidden';
        document.body.style.position = 'fixed';
        document.body.style.insetInline = '0';
        this._lockY = window.scrollY || 0;
        document.body.style.top = -this._lockY + 'px';
        const el = this.drawerRef.current;
        const first = el && (el.querySelector('nav a[href]') || el.querySelector(FOCUSABLE));
        if (first) first.focus();
      } else {
        document.body.style.overflowY = '';
        document.body.style.overflowX = '';
        document.body.style.position = '';
        document.body.style.insetInline = '';
        document.body.style.top = '';
        window.scrollTo(0, this._lockY || 0);
        if (this.menuRef.current) this.menuRef.current.focus();
      }
    }
  }

  paintBody() {
    const t = this.state.theme;
    const dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    document.body.style.background = dark ? '#1a1918' : '#f6f5f4';
  }

  cycleTheme = () => {
    const next = ORDER[(ORDER.indexOf(this.state.theme) + 1) % ORDER.length];
    this.setState({ theme: next });
    try { localStorage.setItem(TKEY, next); } catch (e) {}
  };

  togglePin = () => {
    const next = !this.state.pinned;
    this.setState({ pinned: next, drawer: false });
    try { localStorage.setItem(PKEY, next ? '1' : '0'); } catch (e) {}
  };

  closeDrawer = () => this.setState({ drawer: false });

  trapTab = (e) => {
    if (e.key !== 'Tab') return;
    const el = this.drawerRef.current;
    if (!el) return;
    const items = Array.prototype.filter.call(el.querySelectorAll(FOCUSABLE), (n) => n.offsetParent !== null);
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };

  renderVals() {
    const s = this.state;
    const sidebarMode = s.wide && s.pinned;
    return {
      theme: s.theme,
      themeAuto: s.theme === 'auto',
      themeLight: s.theme === 'light',
      themeDark: s.theme === 'dark',
      themeLabel: LABEL[s.theme],
      themeAria: '테마 변경, 현재 ' + LABEL[s.theme],
      sidebarMode,
      topbarMode: !sidebarMode,
      drawerOpen: s.drawer,
      drawerStr: s.drawer ? 'true' : 'false',
      showPinInDrawer: s.wide,
      menuRef: this.menuRef,
      drawerRef: this.drawerRef,
      onTheme: this.cycleTheme,
      onPin: this.togglePin,
      onOpenDrawer: () => this.setState({ drawer: true }),
      onCloseDrawer: this.closeDrawer,
      onDrawerKey: this.trapTab,
    };
  }
}
</script>
