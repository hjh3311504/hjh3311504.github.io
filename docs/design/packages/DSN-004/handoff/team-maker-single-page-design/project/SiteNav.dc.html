<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/notion-e5ec3c58-0bba-4770-8bb2-3cee184c0cb2/tokens/fonts.css">
<link rel="stylesheet" href="_ds/notion-e5ec3c58-0bba-4770-8bb2-3cee184c0cb2/tokens/colors.css">
<link rel="stylesheet" href="_ds/notion-e5ec3c58-0bba-4770-8bb2-3cee184c0cb2/tokens/typography.css">
<link rel="stylesheet" href="_ds/notion-e5ec3c58-0bba-4770-8bb2-3cee184c0cb2/tokens/spacing.css">
<link rel="stylesheet" href="_ds/notion-e5ec3c58-0bba-4770-8bb2-3cee184c0cb2/tokens/shape.css">
<link rel="stylesheet" href="_ds/notion-e5ec3c58-0bba-4770-8bb2-3cee184c0cb2/tokens/elevation.css">
<script src="_ds/notion-e5ec3c58-0bba-4770-8bb2-3cee184c0cb2/_ds_bundle.js"></script>
</helmet>
<div style="display:flex; flex-direction:column; height:100%; min-height:0; padding:18px 14px 14px; font-family:var(--font-body); color:var(--text-body); background:transparent;">

  <div style="display:flex; align-items:center; gap:2px; padding:0 2px 0 10px; min-height:36px;">
    <a href="SCR-WEB-002%20Home.dc.html" style="flex:1 1 auto; min-width:0; height:36px; display:flex; align-items:center; font-family:var(--font-display); font-weight:700; font-size:18px; line-height:1; letter-spacing:-0.3px; color:var(--text-heading); text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Juno&#39;s develog</a>

    <sc-if value="{{ showTheme }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ onTheme }}" aria-label="{{ themeAria }}" title="{{ themeAria }}" style="flex:none; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:0; background:transparent; color:var(--text-muted); border-radius:8px; cursor:pointer;" style-hover="background:var(--row-hover); color:var(--text-heading)">
        <sc-if value="{{ themeAuto }}" hint-placeholder-val="{{ true }}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"></path></svg>
        </sc-if>
        <sc-if value="{{ themeLight }}" hint-placeholder-val="{{ false }}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.9 4.9 1.4 1.4"></path><path d="m17.7 17.7 1.4 1.4"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.3 17.7-1.4 1.4"></path><path d="m19.1 4.9-1.4 1.4"></path></svg>
        </sc-if>
        <sc-if value="{{ themeDark }}" hint-placeholder-val="{{ false }}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path></svg>
        </sc-if>
      </button>
    </sc-if>

    <sc-if value="{{ showPin }}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{ onPin }}" aria-pressed="{{ pinnedStr }}" aria-label="{{ pinLabel }}" title="{{ pinLabel }}" style="flex:none; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:0; background:transparent; color:var(--text-muted); border-radius:8px; cursor:pointer;" style-hover="background:var(--row-hover); color:var(--text-heading)">
        <sc-if value="{{ pinned }}" hint-placeholder-val="{{ true }}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path><path d="m16 15-3-3 3-3"></path></svg>
        </sc-if>
        <sc-if value="{{ unpinned }}" hint-placeholder-val="{{ false }}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path><path d="m14 9 3 3-3 3"></path></svg>
        </sc-if>
      </button>
    </sc-if>

    <sc-if value="{{ showClose }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ onClose }}" aria-label="메뉴 닫기" title="메뉴 닫기" style="flex:none; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:0; background:transparent; color:var(--text-muted); border-radius:8px; cursor:pointer;" style-hover="background:var(--row-hover); color:var(--text-heading)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </sc-if>
  </div>

  <nav aria-label="사이트 메뉴" style="display:flex; flex-direction:column; gap:2px; margin-top:18px;">

    <sc-if value="{{ homeActive }}" hint-placeholder-val="{{ false }}">
      <a href="SCR-WEB-002%20Home.dc.html" aria-current="page" style="display:flex; align-items:center; gap:10px; height:38px; padding:0 10px 0 7px; border-left:3px solid var(--nav-accent); border-radius:5px; background:var(--nav-wash); color:var(--nav-accent); font-size:15px; font-weight:700; text-decoration:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>
        <span style="flex:1;">홈</span>
        <span style="flex:none; font-size:11px; font-weight:600; line-height:1; padding:3px 7px; border:1px solid currentColor; border-radius:9999px;">현재</span>
      </a>
    </sc-if>
    <sc-if value="{{ homeIdle }}" hint-placeholder-val="{{ true }}">
      <a href="SCR-WEB-002%20Home.dc.html" style="display:flex; align-items:center; gap:10px; height:38px; padding:0 10px 0 7px; border-left:3px solid transparent; border-radius:5px; background:transparent; color:var(--text-body); font-size:15px; font-weight:500; text-decoration:none;" style-hover="background:var(--row-hover)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>
        <span style="flex:1;">홈</span>
      </a>
    </sc-if>

    <div style="font-size:12px; font-weight:600; letter-spacing:0.4px; color:var(--text-muted); padding:18px 10px 6px;">프로젝트</div>

    <div style="display:flex; flex-direction:column; gap:2px; padding-left:13px; border-left:1px solid var(--hairline); margin-left:10px;">
      <sc-if value="{{ tmActive }}" hint-placeholder-val="{{ false }}">
        <a href="SCR-WEB-001%20Team%20Maker.dc.html" aria-current="page" style="display:flex; align-items:center; gap:10px; height:38px; padding:0 10px 0 7px; border-left:3px solid var(--nav-accent); border-radius:5px; background:var(--nav-wash); color:var(--nav-accent); font-size:15px; font-weight:700; text-decoration:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="m15 15 6 6"></path><path d="m4 4 5 5"></path></svg>
          <span style="flex:1;">Team Maker</span>
          <span style="flex:none; font-size:11px; font-weight:600; line-height:1; padding:3px 7px; border:1px solid currentColor; border-radius:9999px;">현재</span>
        </a>
      </sc-if>
      <sc-if value="{{ tmIdle }}" hint-placeholder-val="{{ true }}">
        <a href="SCR-WEB-001%20Team%20Maker.dc.html" style="display:flex; align-items:center; gap:10px; height:38px; padding:0 10px 0 7px; border-left:3px solid transparent; border-radius:5px; background:transparent; color:var(--text-body); font-size:15px; font-weight:500; text-decoration:none;" style-hover="background:var(--row-hover)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="m15 15 6 6"></path><path d="m4 4 5 5"></path></svg>
          <span style="flex:1;">Team Maker</span>
        </a>
      </sc-if>
    </div>

  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:264,&quot;height&quot;:560},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;team-maker&quot;,&quot;blog&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home' | 'team-maker' | 'blog'&quot;},&quot;showTheme&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;themeMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto' | 'light' | 'dark'&quot;},&quot;onTheme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;showPin&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;pinned&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onPin&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;showClose&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const THEME_LABEL = { auto: '자동', light: '밝게', dark: '어둡게' };

class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const active = p.active || 'home';
    const mode = p.themeMode || 'auto';
    const showTheme = p.showTheme !== false;
    const showPin = p.showPin !== false;
    return {
      homeActive: active === 'home',
      homeIdle: active !== 'home',
      tmActive: active === 'team-maker',
      tmIdle: active !== 'team-maker',
      blogActive: active === 'blog',
      blogIdle: active !== 'blog',
      showClose: !!p.showClose,
      onClose: p.onClose,
      showTheme,
      showPin,
      showFoot: showTheme || showPin,
      themeAuto: mode === 'auto',
      themeLight: mode === 'light',
      themeDark: mode === 'dark',
      themeLabel: THEME_LABEL[mode],
      themeAria: '테마 변경, 현재 ' + THEME_LABEL[mode],
      onTheme: p.onTheme,
      onPin: p.onPin,
      pinned: !!p.pinned,
      unpinned: !p.pinned,
      pinnedStr: p.pinned ? 'true' : 'false',
      pinLabel: p.pinned ? '사이드바 고정 해제' : '사이드바 고정',
    };
  }
}
</script>
</body>
</html>
