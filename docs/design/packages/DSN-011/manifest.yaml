  summary: 새 권한·서버·데이터 전송·위험 동작은 없다. 안내 문구가 실제 무작위 배정, 팀별 인원 차이 최대 1명, 브라우저 저장 동작과 일치하는지 검토했고 실력 균형을 보장한다는 표현은 제외했다. 기존 도구를 먼저 사용한 뒤 안내와 FAQ를 읽는 순서, H1 하나와 모바일 1열 배치를 함께 확인했다.
