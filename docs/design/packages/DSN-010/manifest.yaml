review:
  type: expert
  summary: 사용자가 전달한 Claude Design DSN-009 최종 작업물을 DSN-010의 시각 기준으로 삼았다. 기존 정책과 충돌하던 3팀 이상 패배 기준을 2등부터 전체 패배로 고치고 승률 표현을 1등 확률로 바꿨다. 첨부본이 추가한 명단 복사, 4. 오늘의 기록, 전체 기록 탭·정렬·검색, 누적 당첨자 카드, 추첨 중 바로 뽑기와 닫기 제한을 승인 문서에 명시했다. 빈 기록, 이전 형식 기록, 유효한 1등이 없는 기록, 키보드 닫기 제한과 정렬 동률 기준을 함께 검토했다.
