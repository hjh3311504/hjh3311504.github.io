- id: REQ-ARAM-001
  text: /aram-mayhem은 리그 오브 레전드 칼바람 나락 아수라장(증바람) 모드 초보자가 챔피언별 추천 증강과 아이템 순서를 찾는 읽기 전용 가이드다. 허브 /aram-mayhem은 위에서부터 패치 기준, 이름 검색(이름·별명·초성으로 찾음), 역할 버튼(전체·마법사·원거리 딜러·전사·암살자·탱커·서포터 중 가이드에 있는 역할), 가나다순 챔피언 타일 목록, 꼭 읽어야 할 증강 공략 링크(증강 이름과 관심을 끄는 한 줄 소개), 사용 안내, Riot Games 고지와 footer를 보여 준다. 챔피언 타일은 /aram-mayhem/챔피언id 공략 페이지 링크다. 예전 주소의 `#챔피언id`는 그 챔피언 공략 페이지로 옮긴다. 챔피언 공략 페이지는 제목, 패치 기준, 구분선 없는 챔피언 설명, Riot Games 고지와 footer 순서다. 화면 오른쪽 아래에 떠 있는 `챔피언 검색` 버튼이나 `/` 키로 위쪽에 고정한 검색 창을 열고, 입력창(placeholder와 aria-label `다른 챔피언 찾기`)에 바로 초점을 둔다. 템트리 요약 문장·공략 질문·사용 안내는 챔피언 페이지에 두지 않는다. 검색 창은 입력할 때만 자동완성 목록을 보여 주고 방향키·Enter·마우스로 이동하며 Escape나 닫기 버튼으로 닫는다. `/` 키는 입력 중이거나 다른 창이 열려 있으면 동작하지 않는다. 다른 챔피언 링크 목록은 두지 않는다. 증강 공략 /aram-mayhem/augments/증강id는 제목, 패치 기준, 증강 아이콘·이름·등급, 효과, 모든 챔피언이 같은 템트리면 그 템트리, 그 템트리를 고른 이유(장갑 충격은 물리 피해라 마지막 아이템이 방어구 관통력의 도미닉 경의 인사), 증강의 다른 템트리(장갑 충격 쇠사슬 조끼 6개)와 운영 방법, 어울리는 챔피언마다 챔피언 공략 링크·그 증강 빌드의 코어 아이템·그 증강이 든 조합 카드, Riot Games 고지와 footer 순서이고 챔피언 검색 버튼을 같이 둔다. 어울리는 챔피언 제목 오른쪽에 필수·선택 증강 범례를 둔다. 챔피언 조합 없이 정리한 증강(운명의 무기)은 효과 아래에 관통력이 100%까지 오른다는 굵은 강조 문장, 1코어 추천 카드(AD 챔피언·AP 챔피언과 아이템·이유)와 알아 둘 점을 출처 없이 보여 주고, 어울리는 챔피언 제목과 범례는 두지 않는다. 검색은 띄어쓰기를 무시하고 이름·별명·초성을 찾는다. 챔피언 설명은 이름·역할·난이도, 아이템 추천 카드, 상황별 신발, 증강 추천 카드, 나오면 좋은 증강과 피할 증강 순서다. 아이템 추천 카드는 기본 빌드와 증강 빌드를 버튼으로 바꿔 보며 코어 아이템을 화살표 순서로, 스킬 마스터 순서가 있으면 그 아래에, 3코어 이후 추천 아이템을 상황 문장과 함께 보여 준다. 증강 공략 원본에 그 증강의 다른 템트리(장갑 충격의 쇠사슬 조끼 6개 + 능력치 모루 반복 구매)가 있으면 그 증강 빌드가 있는 모든 챔피언에게 `{증강} · {템트리 이름}` 버튼을 그 증강 빌드 바로 뒤에 더하고, 아이템 옆에 갯수·구매 방법을 표시하며 기본 빌드와 비교 표시는 하지 않는다. 증강 빌드는 첫 기본 빌드와 비교해 기본 코어를 유지하며 더한 아이템에 추가, 바꾼 아이템에 변경, 기본 빌드에 없던 추천 아이템에 추가를 표시한다. 증강 추천 카드는 강력 추천을 먼저 두고 필수 증강은 실선, 선택 증강은 점선 테두리로 구분하며 범례는 증강 추천 제목 오른쪽에 한 번만 둔다. 설명과 단계 문장 안의 스킬·증강·아이템·스킬 가속·방어구 관통력·마법 관통력·모루는 글자와 세로 중심을 맞춘 아이콘 타일로 보여 주고 스킬 이름 뒤 조사는 이름의 받침에 맞춘다. 출처는 디시인사이드 칼바람 나락 갤러리 글과 유튜브 영상만 카드 오른쪽 아래에 새 탭 링크로 표시한다. 추천 기준 안내는 승률 통계로 매긴 티어표가 아니라 재밌다고 알려진 도파민 빌드라고 밝히고 디시인사이드라는 이름을 적지 않는다. 강력 추천과 추천 표시는 유지한다. 증강을 누르면 같은 카드 아래에 이름·등급·효과를 보여 주고 다시 누르면 닫는다. 조합 카드는 접을 수 있고 다른 챔피언을 봤다가 돌아와도 접은 상태를 유지한다. 961px 이하에서도 가로로 넘치지 않고 640px 이하에서는 빌드 버튼과 증강 상자를 한 열로 둔다. 밝은 테마와 어두운 테마를 지원한다.
  surface: [web]
  source: "사용자 요청 2026-10-24 > 칼바람 아수라장 초보자용 챔피언·증강 시너지 가이드 제작; 사용자 피드백 2026-10-25~26 > 독립 HTML 시안 v1~v86 반복 수정(필수·선택 증강 구분, 출처는 디시·유튜브만, 빌드 탭, 스킬 마스터 순서, 문장 타일); 사용자 요청 2026-10-26 > 시안을 실제 웹사이트 페이지로 구현; 사용자 요청 2026-10-27 > 증바람·챔피언별 검색 노출, 추천 기준의 디시 언급 제거와 도파민 빌드 명시, 챔피언 페이지 선택 영역은 검색할 때만 보이는 C안, 이후 떠 있는 검색 버튼과 검색 창(G안)으로 변경, 허브 타일 유지·챔피언 페이지 링크 목록 없음, 장갑 충격·벌이다 검색 노출을 위한 증강 공략 페이지; 사용자 요청 2026-10-28 > 운명의 무기 공략은 챔피언별 공략 없이 1코어 추천만 짧게, 별명 운무, AD 도미닉 경의 인사·AP 무덤꽃 카드 2개, 이 페이지 출처 없음, 방어구·마법 관통력 타일과 관통력 100% 강조, 장갑 충격 쇠사슬 조끼 6개 + 모루 템트리를 증강·챔피언 공략에 추가, 장갑 충격 기본 빌드의 도미닉 경의 인사 추천 이유, 허브 증강 링크는 한 줄 소개(탱커가 딜러로·광역 데미지 딜링·방마관 100% 만들기)"
