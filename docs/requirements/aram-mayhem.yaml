  source: "사용자 피드백 2026-10-26 > 악의·피바라기 금지, 횃불·루덴 추천 칸 금지, 탱커 1코어 강철심장; 사용자 요청 2026-10-26 > 실제 웹사이트 페이지 구현; 사용자 검토 2026-10-27 > 챔피언 173명 전체 별명, 증강 별명 16개, 아이템 별명은 새벽검만"
