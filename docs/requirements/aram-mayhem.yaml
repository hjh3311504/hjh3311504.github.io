- id: REQ-ARAM-002
  text: 가이드 내용의 원본은 `docs/research/aram-mayhem/`의 조사 JSON이다. 챔피언 조합 없이 정리한 증강 공략(1코어 추천·팁)은 `augment-guides.json`이다. 화면에 출처는 보여 주지 않고 근거 글 번호만 `community-posts.json`과 잇는다. `npm run generate:aram-mayhem`은 원본을 읽어 화면 데이터 `src/lib/aram-mayhem/guide-data.json`과 아이콘 webp(`static/images/aram-mayhem/`)를 만든다. 아이콘은 Riot Data Dragon과 CommunityDragon에서 받아 사이트에 함께 배포하고 화면에서 외부 이미지 주소를 쓰지 않는다. 아이템 이름은 아수라장 상점 목록의 번호로만 찾는다. 근거 수준이 inferred인 조합은 화면에 넣지 않는다. 찾지 못한 챔피언·증강·아이템이 있으면 생성을 실패로 끝낸다. 별명 원본 `aliases.json`의 챔피언 목록은 Data Dragon 한국어 챔피언 전체와 같아야 하고 가이드에 없는 챔피언도 포함한다. 증강·아이템 별명은 실제 이름과 연결되어야 하며 다르면 생성을 실패로 끝낸다. 가이드 아이템 규칙은 악의·피바라기를 추천하지 않고 어둠불꽃 횃불·루덴의 메아리를 추천 아이템 칸에 넣지 않으며 탱커 기본 빌드의 1코어를 강철심장으로 둔다. 단위 테스트가 생성 데이터의 참조 연결과 이 규칙, 별명 연결, 문장 나누기와 조사 보정, 이름·별명·초성 검색과 빌드 비교 규칙, 검색 문구를 확인한다. 내려받은 원본은 Git에서 제외한 `.cache/aram-mayhem`에 둔다.
