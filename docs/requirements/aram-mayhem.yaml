- id: REQ-ARAM-003
  text: /aram-mayhem 허브, /aram-mayhem/챔피언id 공략, /aram-mayhem/augments/증강id 공략 페이지는 마지막 슬래시를 사용하지 않고 build/aram-mayhem.html, build/aram-mayhem/챔피언id.html, build/aram-mayhem/augments/증강id.html로 생성한다. 허브는 홈 둘러보기·소개 페이지·공통 내비게이션에 연결하고, 허브와 모든 챔피언·증강 공략을 sitemap·canonical·공유 정보·방문 통계 공개 경로에 넣는다. 없는 챔피언·증강 주소는 404다. AdSense 코드는 REQ-WEB-027에 따라 다른 도구 페이지와 같이 넣고 가이드 영역 안에 광고 단위를 직접 배치하지 않는다. 브라우저 저장소에는 아무것도 저장하지 않는다. 챔피언 설명·Riot Games 고지, 허브의 사용 안내와 챔피언 링크는 정적 HTML에 포함한다. build 검증은 허브와 모든 챔피언 페이지의 제목·h1 1개·canonical·sitemap·이동 경로 구조화 데이터, 허브의 챔피언 링크와 목록 구조화 데이터, 챔피언 페이지에 다른 챔피언 링크가 없는지, 추천 기준 안내에 통계·디시인사이드 표현이 없는지, 홈 링크와 이미지가 모두 `/images/aram-mayhem/` 아래 배포 파일인지, 증강 공략의 허브 링크·sitemap·제목·canonical·검색 버튼·범례·챔피언 링크(1코어 추천 증강은 추천 아이템)·이동 경로와 챔피언 목록 구조화 데이터를 확인한다. 배포 workflow는 허브와 챔피언 공략 1개, 증강 공략 1개가 200으로 응답하는지 확인한다. 브라우저 검사는 허브 타일 이동, 허브 → 증강 공략 → 챔피언 공략 이동, 예전 #주소 이동, 허브의 이름·별명·초성·역할 거르기, 챔피언 페이지 검색 버튼·`/` 키로 연 검색 창의 자동완성·키보드 이동·닫기, 빌드 탭과 바뀐 아이템 표시, 증강 효과 열기·닫기, 접은 카드 유지, 없는 챔피언·증강 404, 좁은 화면 가로 넘침을 확인한다.
