- id: REQ-ARAM-001
  text: /aram-mayhem은 리그 오브 레전드 칼바람 나락 아수라장(증바람) 모드 초보자가 챔피언별 추천 증강과 아이템 순서를 찾는 읽기 전용 가이드다. 허브 /aram-mayhem은 위에서부터 패치 기준, 이름 검색(이름·별명·초성으로 찾음), 역할 버튼(전체·마법사·원거리 딜러·전사·암살자·탱커·서포터 중 가이드에 있는 역할), 가나다순 챔피언 타일 목록, 사용 안내, Riot Games 고지와 footer를 보여 준다. 챔피언 타일은 /aram-mayhem/챔피언id 공략 페이지 링크다. 예전 주소의 `#챔피언id`는 그 챔피언 공략 페이지로 옮긴다. 챔피언 공략 페이지는 제목, 패치 기준, 다른 챔피언 찾기 검색창, 챔피언 설명, Riot Games 고지와 footer 순서다. 템트리 요약 문장·공략 질문·사용 안내는 챔피언 페이지에 두지 않는다. 검색창은 입력할 때만 자동완성 목록을 보여 주고 방향키·Enter·마우스로 이동하며 다른 챔피언 링크 목록은 두지 않는다. 검색은 띄어쓰기를 무시하고 이름·별명·초성을 찾는다. 챔피언 설명은 이름·역할·난이도, 아이템 추천 카드, 상황별 신발, 증강 추천 카드, 나오면 좋은 증강과 피할 증강 순서다. 아이템 추천 카드는 기본 빌드와 증강 빌드를 버튼으로 바꿔 보며 코어 아이템을 화살표 순서로, 스킬 마스터 순서가 있으면 그 아래에, 3코어 이후 추천 아이템을 상황 문장과 함께 보여 준다. 증강 빌드는 첫 기본 빌드와 비교해 기본 코어를 유지하며 더한 아이템에 추가, 바꾼 아이템에 변경, 기본 빌드에 없던 추천 아이템에 추가를 표시한다. 증강 추천 카드는 강력 추천을 먼저 두고 필수 증강은 실선, 선택 증강은 점선 테두리로 구분하며 범례는 증강 추천 제목 오른쪽에 한 번만 둔다. 설명과 단계 문장 안의 스킬·증강·아이템·스킬 가속·모루는 글자와 세로 중심을 맞춘 아이콘 타일로 보여 주고 스킬 이름 뒤 조사는 이름의 받침에 맞춘다. 출처는 디시인사이드 칼바람 나락 갤러리 글과 유튜브 영상만 카드 오른쪽 아래에 새 탭 링크로 표시한다. 추천 기준 안내는 승률 통계로 매긴 티어표가 아니라 재밌다고 알려진 도파민 빌드라고 밝히고 디시인사이드라는 이름을 적지 않는다. 강력 추천과 추천 표시는 유지한다. 증강을 누르면 같은 카드 아래에 이름·등급·효과를 보여 주고 다시 누르면 닫는다. 조합 카드는 접을 수 있고 다른 챔피언을 봤다가 돌아와도 접은 상태를 유지한다. 961px 이하에서도 가로로 넘치지 않고 640px 이하에서는 빌드 버튼과 증강 상자를 한 열로 둔다. 밝은 테마와 어두운 테마를 지원한다.
  surface: [web]
  source: "사용자 요청 2026-10-24 > 칼바람 아수라장 초보자용 챔피언·증강 시너지 가이드 제작; 사용자 피드백 2026-10-25~26 > 독립 HTML 시안 v1~v86 반복 수정(필수·선택 증강 구분, 출처는 디시·유튜브만, 빌드 탭, 스킬 마스터 순서, 문장 타일); 사용자 요청 2026-10-26 > 시안을 실제 웹사이트 페이지로 구현; 사용자 요청 2026-10-27 > 증바람·챔피언별 검색 노출, 추천 기준의 디시 언급 제거와 도파민 빌드 명시, 챔피언 페이지 선택 영역은 검색할 때만 보이는 C안, 허브 타일 유지·챔피언 페이지 링크 목록 없음"
