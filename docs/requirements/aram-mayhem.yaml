- id: REQ-ARAM-004
  text: 아수라장 페이지의 검색 문구는 `src/lib/aram-mayhem/seo.js`가 가이드 데이터에서 만든다. 허브 제목은 `증바람 공략 | 칼바람 아수라장 챔피언별 증강·템트리 (패치)`, h1은 `증바람 공략`이다. 챔피언 페이지 제목은 `증바람 {챔피언}({별명}) 공략 · {첫 증강 빌드의 증강}({증강 별명}) 템트리 | 칼바람 아수라장 {패치}`이며 증강 빌드가 없으면 `증강·템트리`를 쓴다. h1은 `증바람 {챔피언} 공략`이다. 검색 설명(meta description)은 기본 템트리와 첫 증강 빌드 템트리를 문장으로 쓰고 통계 티어가 아닌 도파민 빌드라고 밝힌다. 화면 본문에는 이 요약을 따로 보여 주지 않는다. 이름에서 기호만 뺀 별명은 괄호로 붙이지 않는다. 조사 을/를·로/으로는 받침에 맞춘다. 구조화 데이터는 WebSite·WebPage·BreadcrumbList를 쓰고 허브에는 챔피언 공략 ItemList를 더한다. FAQPage는 쓰지 않는다.
  surface: [pages]
  source: "사용자 요청 2026-10-27 > 증바람 공략, 증바람 마이 공략·가이드·신주 템·신비한주먹·신주 템트리 검색 노출과 GEO 최적화; 사용자 피드백 2026-10-27 > 챔피언 페이지의 템트리 요약·공략 질문·사용 안내 삭제"
  kind: structural
