- id: REQ-ARAM-001
  text: /aram-mayhem은 리그 오브 레전드 칼바람 나락 아수라장 모드 초보자가 챔피언별 추천 증강과 아이템 순서를 찾는 읽기 전용 가이드다. 위에서부터 패치 기준·챔피언 수, 이름 검색, 역할 버튼(전체·마법사·원거리 딜러·전사·암살자·탱커·서포터 중 가이드에 있는 역할), 가나다순 챔피언 아이콘 목록, 고른 챔피언 설명, 사용 안내, Riot Games 고지와 footer를 보여 준다. 처음에는 첫 챔피언을 보여 주고 주소의 `#챔피언id`가 있으면 그 챔피언을 연다. 챔피언을 고르면 주소를 `#챔피언id`로 바꾸고 좁은 화면에서는 설명 위치로 내려 준다. 챔피언 설명은 이름·역할·난이도, 아이템 추천 카드, 상황별 신발, 증강 추천 카드, 나오면 좋은 증강과 피할 증강 순서다. 아이템 추천 카드는 기본 빌드와 증강 빌드를 버튼으로 바꿔 보며 코어 아이템을 화살표 순서로, 스킬 마스터 순서가 있으면 그 아래에, 3코어 이후 추천 아이템을 상황 문장과 함께 보여 준다. 증강 빌드는 첫 기본 빌드와 비교해 기본 코어를 유지하며 더한 아이템에 추가, 바꾼 아이템에 변경, 기본 빌드에 없던 추천 아이템에 추가를 표시한다. 증강 추천 카드는 강력 추천을 먼저 두고 필수 증강은 실선, 선택 증강은 점선 테두리로 구분하며 범례는 증강 추천 제목 오른쪽에 한 번만 둔다. 설명과 단계 문장 안의 스킬·증강·아이템·스킬 가속·모루는 아이콘 타일로 보여 주고 스킬 이름 뒤 조사는 이름의 받침에 맞춘다. 출처는 디시인사이드 칼바람 나락 갤러리 글과 유튜브 영상만 카드 오른쪽 아래에 새 탭 링크로 표시한다. 증강을 누르면 같은 카드 아래에 이름·등급·효과를 보여 주고 다시 누르면 닫는다. 조합 카드는 접을 수 있고 다른 챔피언을 봤다가 돌아와도 접은 상태를 유지한다. 961px 이하에서도 가로로 넘치지 않고 640px 이하에서는 빌드 버튼과 증강 상자를 한 열로 둔다. 밝은 테마와 어두운 테마를 지원한다.
  surface: [web]
  source: "사용자 요청 2026-10-24 > 칼바람 아수라장 초보자용 챔피언·증강 시너지 가이드 제작; 사용자 피드백 2026-10-25~26 > 독립 HTML 시안 v1~v86 반복 수정(필수·선택 증강 구분, 출처는 디시·유튜브만, 빌드 탭, 스킬 마스터 순서, 문장 타일); 사용자 요청 2026-10-26 > 시안을 실제 웹사이트 페이지로 구현"
