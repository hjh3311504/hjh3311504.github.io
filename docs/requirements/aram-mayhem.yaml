- id: REQ-ARAM-004
  text: 아수라장 페이지의 검색 문구는 `src/lib/aram-mayhem/seo.js`가 가이드 데이터에서 만든다. 허브 제목은 `증바람 공략 | 칼바람 아수라장 챔피언별 증강·템트리 (패치)`, h1은 `증바람 공략`이다. 챔피언 페이지 제목은 `증바람 {챔피언}({별명}) 공략`만 쓰고, 별명이 없으면 `증바람 {챔피언} 공략`이다. h1은 `증바람 {챔피언} 공략`이다. 검색 설명(meta description)은 검색 결과에서 앞부분만 보이므로 `증바람 {챔피언}({별명})`과 기본 템트리, 첫 증강 빌드의 증강·템트리로 시작하고 뒤에 패치와 통계 티어가 아닌 도파민 빌드라는 안내를 쓴다. 화면 본문에는 이 요약을 따로 보여 주지 않는다. 이름에서 기호만 뺀 별명은 괄호로 붙이지 않는다. 조사 을/를·로/으로는 받침에 맞춘다. 증강 공략 제목은 `증바람 {증강}({별명}) 공략`, h1은 `증바람 {증강} 공략`이다. 검색 설명은 모든 챔피언이 같은 템트리면 그 템트리, 어울리는 챔피언 이름과 수로 시작하고(1코어 추천 증강은 `1코어 추천은 AD 챔피언 {아이템}, AP 챔피언 {아이템}입니다.`와 원본의 검색 문장) 뒤에 패치와 도파민 빌드라는 안내를 쓴다. 증강 효과는 본문에서만 보여 준다. 구조화 데이터는 WebSite·WebPage·BreadcrumbList를 쓰고 허브에는 챔피언 공략 ItemList, 증강 공략에는 어울리는 챔피언이 있으면 그 ItemList를 더한다. FAQPage는 쓰지 않는다.
