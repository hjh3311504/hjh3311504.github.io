- id: REQ-ARAM-003
  text: /aram-mayhem은 마지막 슬래시를 사용하지 않고 build/aram-mayhem.html로 생성하며 홈 둘러보기·소개 페이지·공통 내비게이션·sitemap·canonical·공유 정보·방문 통계 공개 경로에 추가한다. AdSense 코드는 REQ-WEB-027에 따라 다른 도구 페이지와 같이 넣고 가이드 영역 안에 광고 단위를 직접 배치하지 않는다. 브라우저 저장소에는 아무것도 저장하지 않는다. 기본 챔피언의 설명·사용 안내·Riot Games 고지는 정적 HTML에 포함한다. build 검증은 정적 안내 내용·h1 1개·canonical·sitemap·홈 링크와 이미지가 모두 `/images/aram-mayhem/` 아래 배포 파일인지 확인한다. 브라우저 검사는 챔피언 고르기와 주소 반영, 검색·역할 거르기, 빌드 탭과 바뀐 아이템 표시, 증강 효과 열기·닫기, 접은 카드 유지, 좁은 화면 가로 넘침을 확인한다.
  surface: [pages]
  source: "사용자 요청 2026-10-26 > 실제 웹사이트 페이지 구현; 기존 정적 배포·도구 페이지 연결 원칙"
