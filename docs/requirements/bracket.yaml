- id: REQ-BRACKET-003
  text: 대진표 계산과 화면은 외부 라이브러리·API 없이 직접 구현한다. /bracket은 마지막 슬래시를 사용하지 않고 build/bracket.html로 생성하며 홈 둘러보기·공통 내비게이션·sitemap·canonical·공유 정보·방문 통계 공개 경로에 추가한다. AdSense 코드는 REQ-WEB-027에 따라 다른 도구 페이지와 같이 넣는다. 대진표·전체화면 영역 안에 광고 단위를 직접 배치하지 않고 인쇄물에는 광고를 출력하지 않는다. build 검증은 정적 안내 내용·canonical·sitemap 포함을 확인한다. 대진표 계산은 팀2~32개에서 라운드마다 부전승이 최대1개인지와 누락·중복 없이 결승까지 진행되는지 단위 테스트로 확인한다.
