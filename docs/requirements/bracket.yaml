- id: REQ-BRACKET-001
  text: /bracket은 팀2~32개로 한 번 지면 탈락하는 토너먼트 대진표를 만든다. 팀은 Team Maker처럼 입력칸에 쉼표로 여러 팀을 넣거나 일괄 추가 dialog로 추가하고 손잡이 끌기나 화살표 키로 순서를 바꾸며 목록을 확인 후 비울 수 있다. 팀 이름은 공백을 제외해 비어 있지 않은16자 이하이고 중복을 허용하지 않는다. 배치는 입력 순서와 무작위 중 선택한다. 입력 순서가 시드 순서다. 어느 라운드든 남은 팀 수가 홀수일 때만 1팀이 부전승을 받고 같은 팀이 두 라운드 연속 부전승을 받지 않는다. 부전승은 그 조건에서 가장 높은 시드가 받으며 1번과 2번 시드는 결승에서 만난다. 라운드 이름은 남은 팀 수 이상인 가장 작은2의 거듭제곱으로 붙이고 2팀이면 결승이다. 무작위는 팀 순서를 섞은 뒤 같은 배치를 사용한다. 부전승 경기는 자동으로 다음 라운드에 올리며 누를 수 없다. 경기에서 팀을 누르면 승자로 정해 다음 경기에 올린다. 같은 팀을 다시 누르면 승자를 취소한다. 앞 경기 결과를 바꾸거나 취소해 이후 경기 결과가 사라지면 확인 dialog로 사라질 경기 수를 알리고 승인할 때만 지운다. 결승 승자를 우승으로 표시한다. 대진표 제목은 선택 입력이며20자 이하다. 팀 목록·배치·제목을 바꾸면 기존 대진표를 자동으로 바꾸지 않고 다시 만들기를 안내한다. 결과가 있으면 다시 만들기·새 대진표 전에 확인한다. 팀·제목·배치 방식·대진표·결과를200ms로 묶어 localStorage `lake.bracket.v1`에 대진표1개만 저장하고 페이지 종료 시 남은 변경을 저장한다. 저장 실패나 손상된 저장 정보는 문구로 알리고 새 대진표로 계속 사용할 수 있다. 전체화면과 A4 가로1장 인쇄를 제공하며 인쇄물은 화면 대진표와 같은 카드·색·배치를 밝은 색으로 출력한다. 961px 이상 화면은 대진표 섹션이 창 높이 안에 들어오도록 대진표를 최소50%까지 줄이고 사용자가 50~200% 사이로 확대·축소하거나 화면 맞춤으로 되돌릴 수 있고 배율이 70% 미만이면 카드 제목·보조 줄을 숨기고 팀 이름을 키운 글자 위주 카드로 보이며, 인쇄는 A4 가로1장에 맞춰 줄인다. 두 경우 모두 한 방향 배치와 왼쪽·오른쪽 절반이 가운데 결승에서 만나는 좌우 대칭 배치 중 덜 줄여도 되는 배치를 고르며 4팀 이하는 한 방향이다. 960px 이하는 줄이지 않고 한 방향 배치와 라운드 탭을 유지한다. 사용법3단계·6팀 부전승 예제·FAQ는 정적 HTML에 포함하고 기본 펼침 상태로 둔다.
