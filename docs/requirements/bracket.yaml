- id: REQ-BRACKET-002
  text: Team Maker 결과 작업 버튼에 대진표 만들기를 추가한다. 누르면 현재 결과의 팀 이름과 팀원 이름을 localStorage `lake.bracket.import.v1`에 저장하고 /bracket으로 이동한다. Team Maker 저장 데이터 `team-maker:v1`과 현재 결과는 바꾸지 않는다. 팀이1개이거나33개 이상이면 버튼을 비활성하고 2~32팀만 지원한다는 이유를 결과 작업 영역에 보이는 문구로 표시한다. /bracket도 가져온 팀 수를 다시 검사하고 범위 밖이면 기존 대진표를 바꾸지 않는다. /bracket은 처음 열 때 가져올 팀이 있으면 저장된 대진표에 결과가 없을 때 바로 팀 목록을 바꾸고, 결과가 있으면 바꾸기·기존 대진표 유지를 묻는다. 어느 쪽이든 가져온 데이터는 처리 후 지운다. 가져온 팀은 입력 순서 배치로 대진표를 바로 만들고 경기 카드의 팀 이름 아래에 팀원을 한 줄로 줄여 표시한다. 팀 이름을 수정해도 팀원은 유지하고 팀을 삭제하면 함께 지운다. 직접 입력한 팀은 팀원이 없다. 가져오기 저장에 실패하면 Team Maker에서 이유를 알리고 이동하지 않는다.
