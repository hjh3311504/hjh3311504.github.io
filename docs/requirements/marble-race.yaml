  source: "사용자 구현 승인 2026-09-17 > 특수 구간·결승 연출·커스텀 맵과 대규모 참가 지원; 후속 선택 > 팡파레 사용·버터에 왁뿌볼 음원·연못에 기존 물풍선 음원·물풍선 장치 제거; 2026-09-18 크랙 왁스로 이름 변경·음원2개 교체·파괴 전 충돌음; 2026-09-18 화면·경기 길이·음향 개선 계획 구현 승인; 사용자 구현 승인 2026-09-19 > 이름표 항상 표시·모바일 버튼 줄바꿈·엇갈린 결승 회전판; 후속 사용자 선택 2026-09-19 > 윗 회전판 제거·입구 판의 위치와 길이로 되튕김 강화; 사용자 설계·구현 승인 2026-09-22 > 번개·바람 추가와 전체 대상 무작위 선택; 사용자 설계·구현 승인 2026-09-22 > 구슬 가시성·마지막 후보 추적·표시 보간·1000개 최적화·순위 전체 조회·왼쪽 곡면 개선; 사용자 설계·구현 승인 2026-09-22 > 파동180·양쪽 결승 원호·겹침 보정·번호 구슬 순위·전체 준비 화면·성능 분석; 사용자 선택 2026-09-22 > 스킬 렉 개선·순위6열·수평 기준20° 벽 유지와 회전바 위치 조정; 사용자 요청 2026-09-22 > 스킬음 축소·회전바 왼쪽 이동·순위 카드 별도 시안; 사용자 설계·구현 승인 2026-09-22 > A안 티켓 카드·구슬과 이름 세로 중앙·이름8자 초과 생략; 사용자 정정 2026-09-24 > 결승0.25배속 강제 유지와2배속 예외 철회"
