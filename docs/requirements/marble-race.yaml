- id: REQ-MARBLE-004
  text: 공개 route /marble-race와 build/marble-race.html을 유지한다. 서버·로그인·외부 음원 API 없이 정적 자산으로 실행한다. 경기 계산은 Web Worker에서1/120초 간격으로 처리하고 빠른 이동은 세분화한다. 구슬 쌍은 주변 격자로 검색하고 고정 순서로 충돌한다. 구슬 생성은 나눠 실행하며 취소할 수 있다. 화면 밖 그림을 생략하고 순위·당첨 목록은 보이는 행 위주로 그리되 전체 결과를 복사한다. 카메라·진행률·음향·미니맵은 같은 경기 배치를 사용한다.1,000개를 성능 기준으로 검사하되 더 큰 입력도 허용한다.준비 시 고정 정보를 한 번 보내고 진행 중에는 구슬 동적 상태와 변경된 블록 속성만 전송한다. 재시작 시 전송·복원 상태를 비우고 이전 Worker 응답을 무시한다. 기본3개 맵×2/30/60개×난수10개는120경기초 안에 전원 완주해야 한다. 결승15초는 초과 횟수·최댓값을 별도로 기록한다. 결승 밀집60개는 입구 판의 시작 각도0·π/2·π·3π/2의4가지에서60경기초 내 완주하고 기존30초 초과 인원도 보고한다. 양쪽 진입과 시작 각도16개를 조합한32개 접전에서는 기존 입구 판과 비교해 선두의 평균 되튕김 높이가20% 이상 커지고 역전 횟수는 줄지 않아야 한다. 기존에 선두가 이기던 고정 접전에서 되튕긴 선두를 뒤 구슬이 추월해 먼저 도착하는 사례를 검사한다. 출구 앞(회전축 높이100위부터30아래)에 미도착 구슬이 있는데8.8경기초 동안 추가 도착이 없으면 배출 정체로 실패한다. 실패 시 미도착 구슬의 위치·속도·접촉 장치와 최근 도착 기록을 남긴다.1,000개 전원 완주 자동 검사는 실행 시간이 길어 삭제한다. 빠른 입력·전송량 검사와5초간의 화면 응답·순위 목록 부분 렌더링 검사는 유지한다. 화면30fps·버튼 응답200ms 기준을 유지하고 시간 기준 변경을 경기 속도 개선으로 표현하지 않는다. 우승 편향은 진입 위치·진입 순위대별 참가 구슬 수로 보정해 이전 배치와 비교한다. 실패를 충돌 생략이나 순간이동으로 숨기지 않는다. 기본3개 맵과2/10/20/30/60/100개·난수10개에서 첫번째 당첨 시간을30명 대비 중앙값20% 이내 목표로 검사한다.1배속과 결승0.25배속을 반영하며 로딩·정지는 제외한다. 다른 방식과300·1000개는 필요할 때 수동 측정해 별도로 기록한다. 계산상 재생 시간과 실제 브라우저 소요 시간을 구분한다. 줄 수·탐색 위치·음향 한도는 저장하지 않는다.
  surface: [pages]
  source: "사용자 구현 승인 2026-09-17 > 특수 구간·결승 연출·커스텀 맵과 대규모 참가 지원; 후속 선택 > 팡파레 사용·버터에 왁뿌볼 음원·연못에 기존 물풍선 음원·물풍선 장치 제거; 2026-09-18 크랙 왁스로 이름 변경·음원2개 교체·파괴 전 충돌음; 2026-09-18 화면·경기 길이·음향 개선 계획 구현 승인; 2026-09-19 결승 모양 유지·대기와 정체 분리·Worker 증분 전송 계획 구현 승인; 2026-09-19 사용자 요청 > 1,000개 장시간 완주 테스트 삭제; 사용자 구현 승인 2026-09-19 > 이름표 항상 표시·모바일 버튼 줄바꿈·엇갈린 결승 회전판; 후속 사용자 선택 2026-09-19 > 윗 회전판 제거·입구 판의 위치와 길이로 되튕김 강화"
  kind: structural
  adr: docs/adr/2026-09-18-화면-경기길이-음향-개선.md

- id: REQ-MARBLE-005
  text: 화면 이름과 공통 메뉴·홈 카드에 ASMR 구슬 레이스를 사용한다. 홈 카드와 공통 내비게이션은 팀 메이커 → ASMR 구슬 레이스 → QR 코드 순서로 배치한다. 프로젝트 아이콘은 홈에서 팀 메이커 청록색·구슬 레이스 파란색·QR 코드 보라색 배경과 흰 선을 사용하고 드로워에서 밝은 테마의 검은색 계열·어두운 테마의 밝은 단색으로 통일한다. 검색 제목은 ASMR 구슬 레이스 | 무료 구슬 추첨기·랜덤 뽑기다. 검색 설명·canonical·Open Graph·Twitter 공유 정보와1200×630 전용 이미지를 제공하고 WebPage·WebApplication 구조화 데이터는 실제 기능과 본문에 맞춘다. 평점·리뷰를 임의로 만들지 않는다. 공개 route와 robots·sitemap을 유지한다. 도감 아래에 공용 DisclosureSection으로 사용법3단계·4가지 당첨 방식·수업/방송 활용법·FAQ를 기본 펼침 상태로 제공한다. 안내와 검색 정보는 정적 HTML에도 포함한다. 버튼·경기 상태·정지 창 제목은 일시정지로 통일한다. 경기 시작·당첨·종료·배속의 화면 읽기 안내는 경기장 안에 배치해 숨김 스타일과 전체화면이 함께 적용되게 한다. 안내 문장은 구슬 수와 당첨 기준을 자연스럽게 읽으며 화면에는 노출하지 않는다. 활용 안내는 가상 참가자 10명 중 4~6번째 도착자 3명을 뽑는 예제로 명단·맵·자리섞기·스킬·결과 복사를 설명한다. 물리 경기의 동일 당첨 확률을 보장하지 않으며 경기 결과의 미저장을 알린다.
  surface: [web]
  source: "사용자 요청 2026-09-18 > ASMR 이름 변경·SEO와 GEO·공용 가이드·일시정지 표시 통일·화면 읽기 안내 용도 점검; 사용자 구현 승인 2026-09-19 > 기존 페이지 안내·활용 예제 보강"
  kind: behavior
