- id: REQ-MARBLE-003
  text: 소리는0.3·1·2배속 모두 같은 파일을 원래 속도·음정으로 재생한다. 일반11종 음원과 기존 재질별 동시 재생 제한을 유지한다. 버터는 기존 왁뿌볼 Crack-A, 연못은 기존 물풍선 asmr-lava 음원을 재사용한다. 분산 핀·유도벽과 결승 판은 고무 범퍼, 당첨은 승인된 Pixabay Tada Fanfare A를 쓴다. 도감과 경기는 같은 음원이며 선택 맵과 장치 음원만 준비한다. 로딩·오디오 실행 확인 후 경기 시간을 진행하고 실패 시 재시도·무음 시작을 제공한다. 화면과 같은 프레임의 음향 범위와 바깥52감쇠를 사용하고 일반층 음향 범위는 최대800이다. 다른 일반층으로 넘어가거나 범위에서 벗어난 재생음은 짧게 줄여 정리한다. 가까운 장치 소리는 함께 들릴 수 있다. 장치 묶음별 중복음을 막고 전체12개·28ms와 실제 오디오 시간을 사용한다. 일시정지·음소거·초기화·페이지 종료 시 정리한다. 후보가 결승에 들어오면0.3배속과 최대2.4배 확대를 유지하며 후보 변경0.3초 뒤 좌우·상하 위치를 부드럽게 추적한다. 확대 중에는 위로 튕긴 후보도 따라가며 화면·미니맵·음향은 같은 좌표를 쓴다. 첫 번째는 선두, 여러 명은 다음 당첨 후보, 마지막은 꼴등, n번째는 현재 n등을 추적한다. 당첨 수가 채워지면1배속으로 돌아간다. 연출 중 배속을 잠그고 이유를 표시하며 일시정지는 허용한다. 당첨자마다 팡파레와 입자를 한 번 실행하고 우측 하단 목록에 즉시 표시한다. 동작 줄이기에서는 확대와 입자를 줄인다. 미니맵은 전체 배치·구슬과 현재 실제 화면의 흰 테두리를 보여준다. 경기장 중앙에 시작 패널, 공용 버튼·카드·대화상자와 재사용 가능한 목록·미니맵·편집기를 사용한다. 본문16px·보조14px, 이름표14px·추적 후보18px를 기준으로 한다.
  surface: [web]
  source: "사용자 구현 승인 2026-09-17 > 특수 구간·결승 연출·커스텀 맵과 대규모 참가 지원; 후속 선택 > 팡파레 사용·버터에 왁뿌볼 음원·연못에 기존 물풍선 음원·물풍선 장치 제거"
