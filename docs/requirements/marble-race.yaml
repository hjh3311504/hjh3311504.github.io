- id: REQ-MARBLE-003
  text: 번개 정지 중에도 결승 회전바는 구슬을 밀어낸다. 남은 정지 시간과 전기 효과는 유지하며 바가 떨어지면 새 위치에서 멈춘다. 해제 후 새 위치에서 낙하한다. 얼음판 고정은 유지한다. 직접 추적 중인 구슬은 검색 여부와 실제 등수에 관계없이 맨 위 왼쪽 첫 카드에 한 번만 표시한다. 실제 등수와 결과 복사 순서는 유지한다. 추적 구슬을 바꾸면 목록을 맨 위로 이동하고 선택한 카드의 키보드 포커스를 유지한다. 자동 따라가기로 돌아가면 기존 순위 순서를 복원한다. 추적 중인 순위 카드를 다시 클릭하거나 Enter·Space로 누르면 추적을 해제하고 자동 따라가기로 돌아간다. 해제된 카드가 화면에 남으면 포커스를 유지하고, 검색 또는 가상 목록에서 사라지면 순위 영역으로 포커스를 옮긴다. 찰칵 키보드는 사용자가 고른 C의 독립된 타건2개(clicky-v6-1.wav·clicky-v6-2.wav)를 번갈아 재생한다. 재질 동시3개·전체 동시6개·최소28ms 제한을 유지한다. 소리는0.25·1·2배속 모두 같은 파일을 원래 속도·음정으로 재생한다. 도각2는 기존 도각3의 두 파일(thock3-v3-1.wav·thock3-v3-2.wav)을 A→B 순서로 번갈아 재생한다. 도각3은 기존 도각2 단음(thock2-v1.wav), 도각4는 이전 도각3 단음(thock3-v2.wav)을 사용한다. 도각1을 포함한 일반 재질별 한도는3개이며 전체 동시6개 한도를 함께 적용한다. 전체 동시6개·최소28ms 제한도 유지한다. 얼음 경사판은 선택한 동결음 frost-freeze-v1.wav를 동결 시작에 한 번 재생하며 지속 접촉에서는 반복하지 않는다. 미리듣기와 경기의 파일을 공유하고 기존 장치 동시1개·전체 동시6개 제한을 유지한다. 크랙 왁스 외 기존 음원·음량과 특수 장치의 재생 제한은 유지한다. 크랙 왁스는 선택한 균열음2개를 파괴 전 독립 충돌부터 번갈아 사용한다. 지속 접촉과 마지막 파괴음은 중복하지 않는다. 다른 특수 장치의 동시3개 제한에서 분리하되 전체 동시6개·28ms 제한을 유지하며, 연못은 기존 물풍선 asmr-lava 음원을 재사용한다. 분산 핀·유도 바·고정 결승 유도벽·결승 회전 바는 팝잇 음원2개를 교대로 재생하며 충돌·반동·그림 효과는 유지한다. 골인 통로의 수직 벽만 무음으로 유지한다. 장치 합계3개·최소100ms와 충돌 세기에 따른 음량은 유지한다. 무음 충돌은 음향 후보와 재생 제한을 소비하지 않는다. 당첨은 승인된 Pixabay Tada Fanfare A를 쓴다. 도감과 경기는 같은 음원이며 선택 맵과 장치 음원만 준비한다. 로딩·오디오 실행 확인 후 경기 시간을 진행하고 실패 시 재시도·무음 시작을 제공한다. 화면과 같은 프레임의 음향 범위와 바깥52감쇠를 사용하고 일반층 음향 범위는 최대800이다. 다른 일반층으로 넘어가거나 범위에서 벗어난 재생음은 짧게 줄여 정리한다. 가까운 장치 소리는 함께 들릴 수 있다. 장치 묶음별 중복음을 막고 전체6개·28ms와 실제 오디오 시간을 사용한다. 일시정지·음소거·초기화·페이지 종료 시 정리한다. 후보가 골인 입구100위(결승 시작점300아래)에 도착하면0.25배속과 최대2.4배 확대를 유지하며 후보가 바뀌면 같은 화면 갱신에서 강조 표식·순위 목록을 새 후보로 즉시 전환한다. 카메라는 이동을 바로 시작하며 실제 시간 약0.3초에 새 목표까지의 거리95%를 부드럽게 따라간다. 확대 중에는 위로 튕긴 후보도 따라가며 화면·미니맵·음향은 같은 좌표를 쓴다. 마지막 방식은 결승 진입부터 기본 배율로 꼴등을 위아래로 추적하고 기존 위치에서 확대·슬로모션을 시작한다. 당첨 뒤에도 남은 구슬을 기본 배율로 추적한다. 첫번째는 선두, 여러명은 범위 안의 다음 당첨 순위 후보, 마지막은 꼴등, n번째는 현재 n등을 추적한다. 당첨 수가 채워지면 연출 전에 선택한1배속 또는2배속으로 돌아간다. 새 경기는1배속으로 시작한다. 배속 버튼 오른쪽에 자리섞기를 제공하며 출발 준비 중에만 사용할 수 있다. 명단과 설정은 유지하고 배치 난수만 다시 정한다. 미리보기와 실제 출발은 같은 난수를 사용하고 전체 미리보기의 자리도 실제 경기와 일치한다. 자리 난수는 저장하지 않는다. 연출 중 배속 버튼에0.25배속을 표시하고 전환을 잠그며 일시정지는 허용한다. 별도의 슬로모션 알림 메시지는 표시하지 않는다. 당첨자마다 팡파레를 한 번 실행하고 우측 하단 목록에 즉시 표시한다. 경기 화면 위에는 이름과 색종이를 실제 시간2.2초 동안 표시하며 연속 당첨 시 새 효과로 교체한다. 같은 시점에 여러명이 당첨되면 이름2개와 추가 인원을 표시한다. 효과는 클릭을 가로채지 않으며 일시정지·초기화·페이지 종료 시 정리한다. 동작 줄이기에서는 색종이와 이동 없이 이름만 표시한다. 미니맵은 전체 배치·구슬과 현재 실제 화면의 흰 테두리를 보여준다. 경기장 중앙에 시작 패널, 공용 버튼·카드·대화상자와 재사용 가능한 목록·미니맵·편집기를 사용한다. 본문16px·보조14px, 이름표14px·추적 후보18px를 기준으로 한다. 이름표를 먼저 그리고 구슬·번호·고정 효과·추적 표식을 그리며 이름끼리 겹쳐도 생략하지 않는다. 추적 이름표는 이름표 중 마지막에 그리고 그 위로 구슬을 그린다. 긴 이름 말줄임과 전체 맵 보기의 이름 표시 범위는 유지한다. 상단 버튼5개는 화면 너비에 맞게 버튼 단위로 줄바꿈한다. 모바일에서는 버튼 묶음이 한 줄 전체를 사용하며0.25배속·스킬 ON/OFF·전체화면에서도 잘리지 않는다. 공용 ToolPageLayout으로 제목 하단32px와 페이지 여백을 맞춘다. 설정 제목은 SectionHeader, 일반 카드는 Surface의 card 스타일, 입력창은 ui-field의 파란 포커스를 사용한다. 당첨 이름 위에16px 여백을 둔다. 일반12종 뒤에 얼음 경사판·크랙 왁스·젤리 연못을 특수 표시와 함께 같은 도감에 둔다. 경기장과 같은 함수로 실제 장치를 그린다. 미니맵은 데스크톱100×300px·모바일64×220px이며 경기장 안으로 높이를 제한한다. 마우스 호버·터치 유지·방향키로 탐색하고 이탈·해제·취소·Escape·포커스 이탈 시 현재 후보를 자동 추적한다. 준비·일시정지·종료에서도 가능하며 기본 배율로 탐색하고 실제 음향 범위와 흰 테두리를 일치시킨다. 전체 맵 탐색은 구역 보기로 바꾼다. 결승 배속·물리·판정은 유지하고 탐색 입력으로 배속을 바꾸지 않는다. 순위 카드는 A안 레이스 티켓을 사용하며2·4·6열·높이192px·행 간격204px로 표시한다. 상단 띠에 등수와 진행률 또는 도착 상태를 표시하며 안쪽 여백은 상하8px·좌우12px로 둔다. 본문에는36px 번호 구슬과 이름을 세로로 묶어 가로·세로 중앙에 배치한다. 이름은 화면에서 읽히는 글자8개까지 표시하고 초과하면 점3개(...)를 붙인다. 결합 이모지는 한 글자로 센다. 전체 이름은 title·접근성 이름·검색·결과 복사에 유지한다. 구슬 색을 반영한 상단 띠와 하단 진행 막대를 사용하며 선택한 카드에는 내용 위로 균일한2px 테두리를 그리고 추적 라벨을 둔다. 라벨은 카드 기준 absolute로 배치하며 오른쪽·아래쪽에서8px 띄우고 안쪽에 세로4px·가로8px 여백을 준다.12px 굵은 흰 글자와 파란 배경으로 표시하며 라벨용 별도 행을 두지 않는다. 구슬·이름 묶음은 상단 띠와 하단 진행 막대 사이 전체 영역의 중앙에 둔다. 두 줄 이름도 라벨과 겹치지 않도록 카드 높이는192px로 둔다. 번호 구슬은 경기와 같은 그리기 함수를 사용한다. 보이는 행과 여유 행만 그리고 검색·열 변경·초기화 시 스크롤을 보정한다. 준비 화면에서도60개 제한 없이 전체 명단을 스크롤·검색하며 필요한 카드만 만든다. 별도 번호 줄은 없다. 검색·카드 추적·전체 결과 복사는 유지한다. 일반 재질별3개·크랙 왁스3개·각 장치3개와 팡파레1개 제한을 유지한다. 장치·질감 그룹 제한·최소 간격·순환 후보 선택을 유지한다. 스킬음을 제외한 전체6개는 충돌음·미리듣기·팡파레가 공유하며 한도가 가득 찼을 때만 팡파레가 기존 소리를 짧게 줄여 교체한다. 교체 순간에도6개를 넘지 않는다. 여러명은 아직 도착하지 않은 범위 시작 순위 후보부터 추적한다. 범위 앞 순위는 당첨·축하·팡파레에서 제외하며 범위 마지막 도착이 확정되면 슬로모션을 해제한다. 결과 목록과 복사는 선택 범위만 당첨자로 표시하고 전체 도착 순위는 그대로 제공한다. 출발 준비 화면에서 배속·자리섞기 옆의 스킬 사용 ON/OFF를 선택한다. 상태 글자의 공간을 고정해 ON/OFF 전환 시 버튼 크기를 유지한다. 기본은 ON이고 경기·일시정지·준비 로딩 중에는 변경할 수 없다. 경기 시작 시 Worker에 설정을 확정하며 진행 요청으로는 바꾸지 않는다. 선택한 상태는 기존 localStorage 설정의 skillsEnabled에 저장하고 다음 방문에 복원한다. 이전 설정에 항목이 없거나 올바른 불리언 값이 아니면 ON으로 시작하며 저장된 OFF는 유지한다. ON이면 경기2초 이후 구슬마다 기본 발동률0.005(초당 약0.5%)로 스킬을 사용한다. 발동할 때 파동·번개·바람 중 하나를 같은 확률로 고르며 구슬별8경기초 대기 시간을 공유한다. 파동의 반경은180이다. 가까운 구슬에 더 큰 바깥 방향 속도를 주며 발사자·도착·동결 구슬은 제외한다. 기본 밀어내는 힘은780이고, 피격 뒤0.65경기초 동안 수평 감쇠를1.5에서0.6으로 줄이며 수평 속도 한도1000·하강 한도900을 적용해 더 멀리 날아가게 한다. 이후 기존 한도로 돌아간다. 위치를 옮기지 않고 기존 벽·블록 충돌을 유지한다. 파동은0.45경기초 동안 표시하고 동작 줄이기에서는 확대 없이 옅은 원으로 표시한다. 경기 시간과 별도 난수를 사용해0.25·1·2배속의 같은 경기 시각 결과를 유지한다. 번개는 반경240 안에서 가장 가까운 상대를 겨냥하고 없으면 경기 전체에서 유효한 상대 하나를 같은 확률로 고른다. 시전자·도착·고정 구슬을 제외하며 전체에도 대상이 없으면 발동과 대기 시간을 만들지 않는다. 대상 선택에는 스킬 전용 난수를 사용한다. 번개는 노란 빛과 밝은 중심선, 불규칙한 잔가지와 낙뢰 지점의 불꽃으로 표시한다. 경기장 상단에서 대상 위치까지 폭32의 번개를0.35경기초 표시하며 공의 반지름을 포함해 발동 순간 한 번 피격을 판정한다. 번개에 닿은 구슬은 속도를0으로 만들고2경기초 제자리에 고정한다. 흰 전기 고리와 전기선을 표시하고 충돌·정체 해소로 움직이지 않으며 해제 뒤 중력으로 움직인다. 바람은 좁은 뿌리에서 위로 넓어지는 어두운 회색 토네이도로 표시한다. 겹쳐진 나선과 가는 연기 곡선이 회전하며 위로 솟아오른다. 동작 줄이기에서는 상승·회전 없이 고정된 토네이도를 표시한다. 바람은 시전 위치의 공 아래에 폭120·높이240으로1경기초 남고 다른 공을 초당650의 초기 속도로 위로 날린다. 같은 바람은 공마다 한 번만 작용하며 도착·고정 구슬을 제외한다. 벽과 블록 충돌을 유지한다. 동작 줄이기에서는 번쩍임과 빠른 이동 효과를 줄인다. 도감 제목은 도감으로 표시하고 기본 블록·특수 블록 아래에 스킬 영역을 둔다. 파동·번개·바람3종은 같은 카드·그리드와 소리 미리듣기를 제공한다. 파동은 경기 그림을 사용하고 번개·바람은 구슬 없는 번개 모양·바람 모양 아이콘을 사용한다. 스킬 발동 순간에만 해당 효과음을 한 번 내며 표시 중 반복하지 않는다. 스킬 ON일 때 경기 준비·재개·음소거 해제에서 음원을 준비한다. 미리듣기와 경기에서 파동 pulse-whoosh-deep-v2.wav·번개 lightning-v1.wav·바람 gust-v1.wav를 공유하며 음정·속도는 배속과 무관하다. 스킬음은 같은 종류를 포함해 보이는 발동마다 한 번씩 모두 재생한다. 동시 재생 수·재생 간격·한 프레임의 선택 제한을 적용하지 않는다. 일반 음향의 동시6개·최소28ms 제한에서도 제외한다. 실제 경기 화면과 파동의 원·번개의 세로 줄기·바람의 상승 범위가 겹칠 때 재생한다. 기존 음향 높이800 제한이나 화면 밖52의 감쇠는 스킬에 적용하지 않는다. 카메라 이동으로 효과 범위가 완전히 화면 밖으로 벗어나면 재생 중인 스킬음을12ms에 걸쳐 줄여 끈다. 지나간 발동은 화면에 다시 들어와도 재생하지 않는다. 미리듣기는 카메라 범위와 무관하며 스킬음 개수·간격 제한도 없다. 음소거·볼륨·일시정지·종료 정리는 유지한다. 일반 충돌음·장치음·축하음은 기존 제한을 유지하며 스킬음과 재생 자리를 공유하지 않는다.
