- id: REQ-MARBLE-004
  text: 공개 route /marble-race와 build/marble-race.html을 유지한다. 서버·로그인·외부 음원 API 없이 정적 자산으로 실행한다. 경기 계산은 Web Worker에서1/120초 간격으로 처리하고 빠른 이동은 세분화한다. 구슬 쌍은 주변 격자로 검색하고 고정 순서로 충돌한다. 구슬 생성은 나눠 실행하며 취소할 수 있다. 화면 밖 그림을 생략하고 순위·당첨 목록은 보이는 행 위주로 그리되 전체 결과를 복사한다. 카메라·진행률·음향·미니맵은 같은 경기 배치를 사용한다.1,000개를 성능 기준으로 검사하되 더 큰 입력도 허용한다.60개 이하120경기초·결승15초를 초기 목표로 검사하고1,000개는600경기초까지 관측한다. 우승 편향은 진입 위치·진입 순위대별 참가 구슬 수로 보정해 이전 배치와 비교한다. 실패를 충돌 생략이나 순간이동으로 숨기지 않는다.
  surface: [pages]
  source: "사용자 구현 승인 2026-09-17 > 특수 구간·결승 연출·커스텀 맵과 대규모 참가 지원; 후속 선택 > 팡파레 사용·버터에 왁뿌볼 음원·연못에 기존 물풍선 음원·물풍선 장치 제거"
