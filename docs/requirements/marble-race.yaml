- id: REQ-MARBLE-004
  text: 결승 겹침은1/120초 물리 단계가 끝날 때 연결된 구슬 묶음과 벽·회전바를 함께 보정한다. 결승에 들어간 구슬과 연결된 이웃을 대상으로 하며 회전바 접촉이 없어도 검사한다.0.1초 대기는 제거한다. 미도착 구슬이64개를 넘으면 벽 보정 뒤 실제 남은 겹침이0.5 이하인지 확인해 조기 종료한다. 실제 위치 보정의 첫3회는 움직일 수 있는 두 구슬의 높이 차가 반지름 합의 절반보다 클 때 위쪽 구슬을 수직으로 먼저 분리한다. 그 뒤에는 기존 양쪽 분리를 사용하며 매회 벽·회전바와 남은 겹침을 다시 확인한다. 속도·반발 처리는 기존 방식을 유지하고 표시 보정에는 위쪽 우선 분리를 사용하지 않는다.64개 이하는 기존 보정 중 오차0.15 기준을 유지한다. 최대512차례와 실제·표시 겹침1 이하 검사 기준은 유지한다. 위치·속도 숫자 배열과 가까운 쌍·연결 정보·벽 후보를 재사용하며 이동량이 탐색 여유의 절반을 넘으면 후보를 다시 찾는다. 서로 파고드는 상대 속도만 제거하고 반발·효과음·스킬은 반복 적용하지 않는다. 보정 후 중앙 통로 진입과 골인을 판정한다. 회전바의 압력은 연결된 번개 구슬에도 전달하되 정지 시간과 자체 속도0을 유지한다. 얼음 고정과 도착 구슬은 이동시키지 않는다. 화면 보간도 같은 접촉 보정을 쓰며 실제 위치·속도·고정 기록·순위는 바꾸지 않는다. 200개 이상 경기의 결승에서는 기본 충돌이 반발 속도를 처리하고 단계 끝의 연결 접촉 처리가 위치 보정을 맡아 중복 벽 탐색을 줄인다. 이때 내부 이동 분할의 상한은4에서8로 조정하되 반지름13보다 작게 유지한다. 기본1/120초 물리 간격과 빠른 이동의 추가 분할은 유지한다. 결승 진입 뒤 큰 경기의 궤적은 달라질 수 있으나 같은 경기 시각의 배속별 결과는 같아야 한다. 블록 각도·크기와 구슬 주변 격자 범위를 재사용하고 회전·크기·격자·경기 변경 시 다시 계산한다. Worker는 한 요청에서12ms 또는4개의 물리 단계를 처리한 뒤 위치를 전달하며, 남은 계산 시간은 화면 프레임을 기다리지 않고 다음 요청에서 이어 처리한다. 상태 수신 뒤 화면 변경을 반영하기 전에 다음 계산을 요청한다. 큰 화면 상태는 실제 시간 기준 최대60회/초로 묶는다.200개 이상은 화면 보간과 그리기도 최대60회/초로 제한하며 물리 계산 요청과 경기 시간은 별도로 유지한다. 사이의 계산에는 잔여 시간만 담은 가벼운 응답을 보낸다. 충돌·스킬 이벤트는 모아 한 번씩 전달하며 당첨·종료·슬로모션 전환은 즉시 보낸다. 일시정지 시 별도 요청으로 최신 물리 상태를 확보한다. 계산할 시간이 부족할 때만 타이머로 기다리며 일시정지·초기화·화면 종료 시 예약을 정리한다. 구슬 충돌 격자·후보·이전 위치를 경기별로 재사용한다. 같은 격자 칸의 번호순 이웃 목록은 물리 단계 사이에도 재사용하며 칸 이동·도착 때 주변9칸을 갱신한다. 높이 범위·구슬 구성·배열 순서가 바뀌면 격자를 다시 만든다. 매 접촉의 거리·위치·속도 판정과 충돌 순서는 유지한다. 단일 블록 접촉면과 결승 높이 정렬·연결 루트의 중복 계산도 줄인다. 블록 탐색은 숫자 좌표와 재사용하는 중복 표시 배열을 사용한다. 기본 충돌 순서·반발력은 유지한다.100개 블록 상한과 결승 경사·회전축 조정으로 바뀐 배치·상태를 새 기준으로 기록하며 같은 구현에서 배속별 상태·이벤트가 일치해야 한다. 결승은1000개·회전각4가지의 벽 통과 방지와 중앙 입구 진입 기록을 별도로 검사한다. 새로 지난 시간에만80ms 제한을 적용하고 잔여 시간은 버리지 않는다. 한 물리 단계의 계산이12ms를 넘을 수 있으므로 응답 시간의 상한을 보장하지는 않는다. 공개 route /marble-race와 build/marble-race.html을 유지한다. 서버·로그인·외부 음원 API 없이 정적 자산으로 실행한다. 경기 계산은 Web Worker에서1/120초 간격으로 처리하고 빠른 이동은 세분화한다. 구슬 쌍은 주변 격자로 검색하고 고정 순서로 충돌한다. 구슬 생성은 나눠 실행하며 취소할 수 있다. 화면 밖 그림을 생략하고 순위·당첨 목록은 보이는 행 위주로 그리되 전체 결과를 복사한다. 카메라·진행률·음향·미니맵은 같은 경기 배치를 사용한다.1,000개를 성능 기준으로 검사하되 더 큰 입력도 허용한다.준비 시 고정 정보를 한 번 보내고 진행 중에는 구슬 숫자 상태를 Float64Array로 묶어 전달하고 고정 효과·이벤트·변경된 블록 속성을 별도로 보낸다. 화면은 이전·현재 상태 사이를 보간하고 구슬·카메라·회전바가 같은 표시 시각을 사용한다. 실제 판정에는 보간을 사용하지 않는다. 미니맵의 구슬은 Canvas로 그린다. 재시작 시 전송·복원 상태를 비우고 이전 Worker 응답을 무시한다. 기본3개 맵×2/30/60개×난수10개는120경기초 안에 전원 완주해야 한다. 결승15초는 초과 횟수·최댓값을 별도로 기록한다. 결승 밀집60개는 입구 판의 시작 각도0·π/2·π·3π/2의4가지에서60경기초 내 완주하고 기존30초 초과 인원도 보고한다. 직선 유도벽에서 회전판만 비교하는 기존32개 접전 검사는 양쪽 진입과 시작 각도16개를 조합하며 선두의 평균 되튕김 높이가20% 이상 커지고 역전 횟수는 줄지 않아야 한다. 현재 왼쪽40°·오른쪽30° 벽과 왼쪽 아래 회전바에서도32개 접전의 완주와 되튕김·역전을 별도로 확인하며 과거 지형과 같은 역전 횟수를 보장하지 않는다. 기존에 선두가 이기던 고정 접전에서 되튕긴 선두를 뒤 구슬이 추월해 먼저 도착하는 사례를 검사한다. 출구 앞(통로 입구100위부터30아래)에 미도착 구슬이 있는데8.8경기초 동안 추가 도착이 없으면 배출 정체로 실패한다. 실패 시 미도착 구슬의 위치·속도·접촉 장치와 최근 도착 기록을 남긴다.1,000개 전원 완주 자동 검사는 실행 시간이 길어 삭제한다. 빠른 입력·전송량 검사와5초간의 화면 응답·순위 목록 부분 렌더링 검사는 유지한다. 화면30fps·버튼 응답200ms 기준을 유지하고 시간 기준 변경을 경기 속도 개선으로 표현하지 않는다. 우승 편향은 진입 위치·진입 순위대별 참가 구슬 수로 보정해 이전 배치와 비교한다. 실패를 충돌 생략이나 순간이동으로 숨기지 않는다. 기본3개 맵과2/10/20/30/60/100개·난수10개에서 첫번째 당첨 시간을30명 대비 중앙값20% 이내 목표로 검사한다.1배속과 결승0.25배속을 반영하며 로딩·정지는 제외한다. 다른 방식과300·1000개는 필요할 때 수동 측정해 별도로 기록한다. 계산상 재생 시간과 실제 브라우저 소요 시간을 구분한다.1000개 성능 분석은 준비·출발·장애물 밀집·결승을 나누고 소리·스킬 OFF와 ON을 비교한다. 물리 계산·Worker 응답·상태 복사와 보간·경기 그림·미니맵·순위·음향 비용을 구분한다. 평균fps 외에 느린 프레임·수신 간격·표시 시각 정체·실제 경기 진행을 기록한다. 비교 사이트와 다른 배치 조건을 밝히고 확인된 원인·추정·개선 우선순위·부작용을 보고한다. 스킬 그림은 전기 고리를 크기·배율·동작 줄이기별로 저장해 재사용하고 토네이도 좌표의 중복 계산을 줄인다. 화면 밖 스킬은 가로 범위도 확인해 그리지 않는다. 스킬 확률·지속 시간·효과음 재생 범위와 동시 재생 정책은 유지한다. 파동·번개·바람의 음량 계수는0.8에서0.4로 낮추며 미리듣기와 경기에서 같이 적용한다. 엔진 교체는 제외한다. 줄 수·탐색 위치·음향 한도는 저장하지 않는다.
  surface: [pages]
  source: "사용자 구현 승인 2026-09-17 > 특수 구간·결승 연출·커스텀 맵과 대규모 참가 지원; 후속 선택 > 팡파레 사용·버터에 왁뿌볼 음원·연못에 기존 물풍선 음원·물풍선 장치 제거; 2026-09-18 크랙 왁스로 이름 변경·음원2개 교체·파괴 전 충돌음; 2026-09-18 화면·경기 길이·음향 개선 계획 구현 승인; 2026-09-19 결승 모양 유지·대기와 정체 분리·Worker 증분 전송 계획 구현 승인; 2026-09-19 사용자 요청 > 1,000개 장시간 완주 테스트 삭제; 사용자 구현 승인 2026-09-19 > 이름표 항상 표시·모바일 버튼 줄바꿈·엇갈린 결승 회전판; 후속 사용자 선택 2026-09-19 > 윗 회전판 제거·입구 판의 위치와 길이로 되튕김 강화; 사용자 설계·구현 승인 2026-09-22 > 구슬 가시성·마지막 후보 추적·표시 보간·1000개 최적화·순위 전체 조회·왼쪽 곡면 개선; 사용자 설계·구현 승인 2026-09-22 > 파동180·양쪽 결승 원호·겹침 보정·번호 구슬 순위·전체 준비 화면·성능 분석; 사용자 선택 2026-09-22 > 스킬 렉 개선·순위6열·수평 기준20° 벽 유지와 회전바 위치 조정; 사용자 요청 2026-09-22 > 스킬음 축소·회전바 왼쪽 이동·순위 카드 별도 시안; 사용자 요청 2026-09-24 > 100개 블록 상한·종료 뒤 설정 수정 시 준비 복귀·마지막 구슬의 회전바 반복 걸림 해소; 후속 사용자 교정 2026-09-24 > 바 길이를 유지하고 위치와 결승 경사 조정; 후속 사용자 요청 > 회전축 오른쪽15 이동·통로 밖으로 밀어내기와 마지막 골인 양립"
