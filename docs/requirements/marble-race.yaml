- id: REQ-MARBLE-002
  text: 기본3개 맵과 활성 일반11종의 순서를 유지한다. 일반4구역을 각각20열×12행, 총960개로 구성한다. 좌우8 교차 배치와 모서리 반지름10, 탄성0.55~0.65·기존 마찰을 유지한다. 첫 충돌 파괴·3초 복구·겹침 시 복구 대기와 예고 윤곽을 유지한다. 참가자가 늘면 겹치지 않는 출발 영역과 아래 배치를 함께 늘리며 출발 바는 없다. 기존960높이의 연결 구간3곳과 유도벽·버터·젤리 연못을 보존하고 각 뒤쪽에260높이의 핀 자리를 추가해1220으로 늘린다. 각 핀 자리에 반지름16·탄성0.45·마찰0.02의 핀13개를 기존 좌표로 복원한다. 마지막 재질과 깔때기 사이에도320높이와 핀13개를 더해 총52개를 배치한다. 물풍선 장치는 제거한다. 좌우 유도벽은 가장자리에서 약3블록 폭 안쪽으로 이끈다. 버터는120×64의 둥근 덩어리로 독립 접촉마다 납작해진다. 파괴 횟수는 max(1, round(5 × sqrt(구슬 수 / 30)))로 경기 시작 시 정하며3초 후 원래 모양과 내구도로 복구한다.2/30/60/1000개에서는1/5/7/29회이며 안내와 블록에 표시한다. 접촉 지속 중 중복 손상은 없으며 옆으로 빠지는 길을 둔다. 연못은 폭452·깊이140이며 한쪽에 폭244의 우회로를 둔다. 좌우는 경기 난수로 정하고 실제 진입한 구슬만 소리와 저항을 받는다. 내부에서는 반동 없이 저항으로 약80/초까지 감속한 뒤 통과한다. 진입음은 진입당1회다. 마지막은 높이740의 깔때기와 길이180·두께16의 회전 판1개, 내부 폭40의 중앙 골인 통로다. 판의 회전축은 통로 중심보다70왼쪽, 시작점400아래의 입구 높이에 둔다. 판 끝이 통로를 막고 열며4.4초마다 반시계 방향으로 회전한다. 시작 각도는 경기 난수로 정하고 표면 속도로 충돌한다. 흰색 직선 유도벽은 양쪽 모두400아래에서 폭40통로와 연결하며 마찰은0이다. 청록색 판은 벽 앞에 그려 충돌 위치를 알아보기 쉽게 한다. 미니맵과 클로즈업은 같은 벽·회전축 위치를 사용한다.710아래 판정선을 실제 아래로 교차한 순서로 도착을 확정하고 같은 단계도 교차 시각으로 정렬한다. 도착 구슬은 충돌에서 제거한다. 원통 진입 조건·순위별 힘·결승 정체 바람은 없다. 결승 이전8초 정체 바람과 모든 충돌은 유지한다.
  surface: [web]
  source: "사용자 구현 승인 2026-09-17 > 특수 구간·결승 연출·커스텀 맵과 대규모 참가 지원; 후속 선택 > 팡파레 사용·버터에 왁뿌볼 음원·연못에 기존 물풍선 음원·물풍선 장치 제거"
