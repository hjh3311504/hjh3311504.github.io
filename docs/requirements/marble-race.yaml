- id: REQ-MARBLE-001
  text: 참가자는 최소2개이며 고정 상한을 두지 않는다. 최초 명단은 토끼*2·고양이*2·오리*2·펭귄*2·수달*2를5줄로 표시해 총10명으로 시작하며 저장된 명단은 유지한다. 게임의 당첨 인원은 명 단위로 표시한다. 최초 방문과 손상·삭제된 맵의 대체 선택은 도각도각 키보드(keyboard)이며 유효하게 저장된 기존 맵은 유지한다. 이름당20자, 줄바꿈·쉼표와 이름*양의정수 입력을 지원한다. 같은 이름도 고유 번호로 별도 당첨될 수 있다. 합계를 먼저 계산하고 안전한 정수가 아니면 오류를 알린다. 참가자·마지막 맵·첫번째/마지막/여러명/n번째 방식·당첨 범위와 순번·볼륨·음소거를 변경할 때마다200ms로 묶어 localStorage에 저장하고 페이지 종료 시 남은 변경을 저장한다. 저장된 타자기 구역은 도각 키보드2로 연결한다. 기존 명단과 맵 별칭은 보존하며 저장 실패해도 경기할 수 있다. 결과와 배속은 저장하지 않는다. 기존 도각 키보드의 표시 이름은 도각 키보드1이며 경기 타일과 도감에는 문자1을 표시한다. 활성12종에서 중복을 허용해4구역을 고른 커스텀 맵을 이름과 함께10개까지 별도 저장한다. 수정·삭제·순서 변경을 지원하며 손상·삭제된 맵은 도각도각 키보드로 돌아간다. 모바일 맵 옵션은1열로 표시한다. 내 맵 만들기는 공용 Dialog의 제목·본문·하단 버튼을 구분하며 본문은 내부 스크롤을 지원한다. 선택 상자는 공용 입력 스타일과 아래 화살표를 사용하고 위로·아래로 버튼과 높이44px 및 세로 중심을 맞춘다. 시작 시 설정을 확정한다. 마지막 방식은 미도착 구슬이1개만 남는 즉시 그 구슬을 당첨자로 확정하고 팡파레·축하 효과·당첨 목록을 한 번 갱신한다. 마지막 구슬의 골인을 기다리지 않으며 당첨 확정 시 슬로모션을 해제하고 선택한 배속으로 돌아간다. 남은 구슬의 물리 계산과 실제 도착 순위 기록은 계속하며 골인 때 다시 축하하지 않는다. 같은 계산 단계에서 전원 도착했다면 실제 교차 순서의 마지막 구슬을 당첨자로 정한다. 설정 영역에 잠금 이유와 경기 종료하고 설정 변경 버튼을 표시한다. 게임 하단의 종료 버튼은 제거하고 일시정지 창에서 종료를 선택한다. 일시정지와 종료 확인은 같은 패널에서 계속하기·종료하고 설정 변경으로 처리하고 별도 확인창은 열지 않는다. 종료하면 경기를 이어갈 수 없고 참가자와 설정은 유지된다고 안내한다. 준비 상태는 게임 상단에 표시하고 시작·재개 시 별도 로딩 창은 띄우지 않는다. 준비 취소는 설정 영역에서만 제공하고 게임 하단에는 준비 취소 버튼을 띄우지 않는다. 시작·계속하기 버튼은 준비 중에도 같은 요소·문구·폭을 유지하고 중복 클릭만 막는다. 소리·볼륨·전체화면·전체 맵은 경기 중 사용한다. 이름 도움말은 토끼*10처럼 입력하면 같은 구슬을 여러 개 넣어요.로 표시한다. 예시 명단 버튼·자동 저장 안내·미리듣기 잠금 설명은 제거하되 기능은 유지한다. 맵 카드는 아이콘·한 줄 이름·선택 표시로 구성하고 전체 이름은 title로 확인하며 목록 아래 선택 맵 설명은 표시하지 않는다. 종료 뒤 참가자 명단·당첨 방식·당첨 순번·순위 범위를 수정하거나 기본·커스텀 맵 선택·수정·삭제로 선택한 맵이 바뀌면 결과·축하 효과·카메라·배속을 초기화하고 레이스 시작 준비 화면으로 돌아간다. 편집한 값과 나머지 설정·음량은 유지한다. 참가자 입력이 잘못되어도 이전 결과는 지우고 시작 버튼을 비활성화한다. 종료 자체나 소리·음량 변경만으로 결과를 지우지 않는다. 여러명은 시작 순위와 끝 순위를 숫자 입력창2개에 각각 입력하며 가운데 ~는 고정 표시한다. 양 끝을 포함하고 모바일 숫자 키보드를 제공한다.4~6은4·5·6번째 도착한3개 구슬을 당첨시킨다. 두 순위는1부터 전체 구슬 수 사이의 안전한 정수이고 시작은 끝보다 크지 않아야 한다. 같은 순위의 범위도 허용한다. 범위 입력은 rangeText로 기존 설정 항목에 함께 저장한다. 이전 count만 있으면1~count로 복구하고 기존 명단·맵·음량·n번째 설정은 유지한다. 도감은 공용 Section 카드의 흰 배경 안에 기본12종·특수3종을 각각 제목과 구분선으로 나눠 표시한다. 블록 카드 배경은 선택되지 않은 맵 옵션과 같은 색을 사용한다. 선택 맵의 기본 블록 이름 오른쪽에 포함 라벨을 붙이고 도감 상단에 선택 맵에 포함된다는 의미를 안내한다. 일반·특수 모두 실제 그림·이름·한 줄 설명·미리듣기 버튼을 같은 카드 형식으로 제공한다. 별도 소리 설명과 중복 문단은 제거하고 크랙 왁스 충돌 횟수는 한 줄 설명에 포함한다. 설명은 줄바꿈하지 않으며 좁은 화면에서는 말줄임과 전체 문장 title을 제공한다. 준비 화면은60개 샘플 제한 없이 전체 구슬을 Worker에서 나눠 생성한다. 준비용 상태에는 물리 접촉 기록을 만들지 않고 실제 경기와 같은 번호·색·출발 위치를 쓴다. 명단 변경·자리섞기·경기 시작·화면 종료는 이전 미리보기 요청을 취소한다. 현재 배율에서 화면 이동·미니맵으로 전체 구슬을 확인한다. 일부 구슬만 표시한다는 안내는 없으며 시작 버튼은 레이스 시작으로 표시한다.
  surface: [web]
  source: "사용자 구현 승인 2026-09-17 > 특수 구간·결승 연출·커스텀 맵과 대규모 참가 지원; 후속 선택 > 팡파레 사용·버터에 왁뿌볼 음원·연못에 기존 물풍선 음원·물풍선 장치 제거; 2026-09-18 크랙 왁스로 이름 변경·음원2개 교체·파괴 전 충돌음; 2026-09-18 화면·경기 길이·음향 개선 계획 구현 승인; 사용자 요청 2026-09-19 > 마지막 미도착1개일 때 당첨 확정; 사용자 설계·구현 승인 2026-09-22 > 파동180·양쪽 결승 원호·겹침 보정·번호 구슬 순위·전체 준비 화면·성능 분석; 사용자 선택 2026-09-22 > 스킬 렉 개선·순위6열·수평 기준20° 벽 유지와 회전바 위치 조정; 사용자 요청 2026-09-22 > 스킬음 축소·회전바 왼쪽 이동·순위 카드 별도 시안; 사용자 요청 2026-09-24 > 100개 블록 상한·종료 뒤 설정 수정 시 준비 복귀·마지막 구슬의 회전바 반복 걸림 해소; 후속 사용자 교정 2026-09-24 > 바 길이를 유지하고 위치와 결승 경사 조정; 후속 사용자 요청 > 회전축 오른쪽15 이동·통로 밖으로 밀어내기와 마지막 골인 양립"
