- id: REQ-MARBLE-001
  text: 참가자는 최소2개이며 고정 상한을 두지 않는다. 기본 명단은 동물30개다. 이름당20자, 줄바꿈·쉼표와 이름*양의정수 입력을 지원한다. 같은 이름도 고유 번호로 별도 당첨될 수 있다. 합계를 먼저 계산하고 안전한 정수가 아니면 오류를 알린다. 참가자·마지막 맵·첫 번째/마지막/여러 명/n번째 방식·당첨 인원과 순번·볼륨·음소거를 변경할 때마다200ms로 묶어 localStorage에 저장하고 페이지 종료 시 남은 변경을 저장한다. 기존 명단과 맵 별칭은 보존하며 저장 실패해도 경기할 수 있다. 결과와 배속은 저장하지 않는다. 활성11종에서 중복을 허용해4구역을 고른 커스텀 맵을 이름과 함께10개까지 별도 저장한다. 수정·삭제·순서 변경을 지원하며 손상·삭제된 맵은 나무공방으로 돌아간다. 시작 시 설정을 확정한다. 설정 잠금 이유와 경기 종료하고 설정 변경 버튼을 항상 표시하고 확인 취소 시 경기를 이어간다. 준비 취소와 일시정지 중 설정 안내도 제공한다. 소리·볼륨·전체화면·전체 맵은 경기 중 사용한다.
  surface: [web]
  source: "사용자 구현 승인 2026-09-17 > 특수 구간·결승 연출·커스텀 맵과 대규모 참가 지원; 후속 선택 > 팡파레 사용·버터에 왁뿌볼 음원·연못에 기존 물풍선 음원·물풍선 장치 제거"
  kind: crud
  ui: true
  design_status: approved
