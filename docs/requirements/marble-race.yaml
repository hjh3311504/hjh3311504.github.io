- id: REQ-MARBLE-002
  text: 기본3개 맵과 활성 일반12종을 제공한다. 도각도각 키보드(keyboard)는 도각1 → 도각2 → 도각3 → 도각4로 구성한다. 별도 도각 키보드 모음은 제거하고 저장된 thock-collection 선택은 keyboard로 연결한다. 찰칵 키보드는 나무공방·도감·커스텀 맵에서 사용한다. 불씨는 비활성화하며 저장한 커스텀 맵의 불씨 자리는 찰칵 키보드로 연결한다. 기존 도각은 내부 ID thock을 유지하며 도각 키보드1로 표시한다. 도각4는 도각1과 다른 음원을 사용한다. 도각4는 도감과 커스텀 맵에도 제공하며 탄성0.61·마찰0.25를 사용한다. 100개 이상은 구역당22줄·전체1,760개의 일반 블록으로 고정한다. 참가자와 출발 공간은 실제 인원을 유지한다. 일반4구역·20열을 유지하고 구역당 행은 max(4, round(12 × sqrt(min(전체 구슬 수, 100) / 30)))로 정한다.2/10/30/60개 경기의 전체 일반 블록은320/560/960/1360개다. 미리보기에서도 펼친 전체 인원으로 계산하고200ms 입력 묶음을 사용한다. 줄 수는 경기 배치에 포함하며 특수 구간·결승·카메라·음향도 같은 높이를 사용한다. 경기 중에는 바꾸지 않는다. 좌우8 교차 배치와 모서리 반지름10, 탄성0.55~0.65·기존 마찰을 유지한다. 첫 충돌 파괴는 유지하되 일반 블록과 크랙 왁스의 재생성은 비활성화한다. 파괴된 자리는 경기 종료까지 비어 있고 복구 예고 윤곽도 표시하지 않는다. 새 경기에서는 블록을 다시 채운다. 참가자가 늘면 겹치지 않는 출발 영역과 아래 배치를 함께 늘리며 출발 바는 없다. 구슬은 한 줄에 최대26개를 같은 높이로 배치하고 초과 인원은40간격으로 다음 줄에 놓는다. 구슬끼리 겹치지 않으며 참가자와 자리의 연결은 난수로 섞는다. 경기 중 구슬끼리의 반발계수는0.8로 정한다. 서로 가까워지는 접촉에서만 반발 속도를 적용하고 고정 구슬은 이동시키지 않으며 도착 구슬은 제외한다. 벽과 장치의 반발계수는 각각의 기존 값을 유지한다. 연결 구간3곳은 높이1220을 유지하며 유도 바 → 분산 핀 → 특수 블록 순서로 배치한다. 첫 특수 구간에는 분산 핀 아래에160×28 크기의 얼음 경사판5개를 둔다. 모든 판은 좌우30도 대각선이며 닿은 구슬을 경기 시간1초 동안 표면에 고정한다. 해제 뒤에는 충돌을 유지한 채 중력으로 미끄러져 떨어지고, 같은 판에서 완전히 떨어지기 전에는 다시 얼지 않는다. 얼음판은 깨지지 않는다. 얼어붙은 구슬은 반투명 얼음 테두리로 표시한다. 양쪽 구슬을 모으는 바 아래에 핀을 두고 그 아래에서 크랙 왁스·젤리 연못을 만나도록 한다. 핀3줄의 세로 간격을50으로 줄이고 중심 높이를 구간 시작점 기준556·606·656에 배치한다. 바와 첫 핀 사이에 약130의 공간을 확보한다. 크랙 왁스·연못 위치는 유지하며 핀과 특수 블록 사이에는 구슬 지름보다 넓은 틈을 둔다. 각 핀 자리에는 반지름16·탄성0.45·마찰0.02의 핀13개를 두며 가로 배치는 유지한다. 마지막 재질과 깔때기 사이에도320높이와 핀13개를 더해 총52개를 배치한다. 물풍선 장치는 제거한다. 좌우 유도벽은 가장자리에서 약3블록 폭 안쪽으로 이끈다. 크랙 왁스는 처음에는 균열 없이 표시하며 손상이 쌓일수록 균열의 수와 굵기를 늘린다. 마지막 충돌에서 파괴되어 사라진다. 크랙 왁스는120×64의 둥근 덩어리로 독립 접촉마다 납작해진다. 현재 위치와 크기를 유지하며 좌측·중앙은 오른쪽 아래30도, 우측은 왼쪽 아래30도로 기울인다. 그림·충돌·압축에 같은 각도를 사용한다. 파괴 횟수는 max(1, round(5 × sqrt(구슬 수 / 30)))로 경기 시작 시 정하며 파괴된 뒤에는 재생성하지 않는다.2/30/60/1000개에서는1/5/7/29회이며 도감 설명에 안내한다. 블록 위 숫자는 표시하지 않고 균열로 손상을 보여준다. 접촉 지속 중 중복 손상은 없으며 옆으로 빠지는 길을 둔다. 연못은 좌·중앙·우3개를 같은 높이에 놓는다. 각 폭152·깊이140이며 가로 중심은88·360·632다. 사이의 우회로2개는 각각 폭120이다. 실제 진입한 연못에서만 소리와 저항을 받으며 진입음은 연못별 진입당 한 번 실행한다. 내부에서는 반동 없이 저항으로 약80/초까지 감속한 뒤 통과한다. 진입음은 진입당1회다. 마지막은 높이740의 깔때기와 입구 회전판1개, 내부 폭40의 중앙 골인 통로다. 입구 판은 길이448·두께16·모서리 반경8이다. 회전축은 x160·결승 시작점480아래에 둔다. 수평 상태에서 x-64부터384까지 걸치며 먼저 온 구슬이 되튕기는 동안 뒤 구슬이 통과할 기회를 준다.13.2경기초마다 반시계 방향으로 회전한다. 시작 각도는 경기 난수로 정하고 표면 속도로 충돌한다. 탄성0.35·마찰0.05를 유지하며 회전바 길이는 남은 구슬 수와 관계없이 경기 내내448을 유지한다. 통로에 완전히 들어온 구슬도 입구 위로 전부 밀려나올 수 있으며 진입 기록을 지운다. 마지막1개도 다시 중앙 통로와 판정선을 지나 골인한다. 반복 반동으로 영구 정체하지 않도록 배치를 검증한다. 윗 회전판은 제거한다. 추가 난수를 소비하지 않으며 모든 기본 맵과 내 맵에 적용한다. 양쪽 유도벽은 수평 기준 왼쪽40°·오른쪽30°인 직선이며 두께는12다. 바깥 시작 높이는 왼쪽이 결승 시작점+400−328×tan(40°), 오른쪽이 결승 시작점+400−328×tan(30°)다. 양쪽 모두400아래에서 폭40통로와 연결하며 마찰은0이다. 청록색 입구 판은 벽 앞에 그려 충돌 위치를 알아보기 쉽게 한다. 미니맵과 클로즈업은 같은 벽·회전축 위치를 사용한다.중앙 폭40 입구를 반지름까지 포함해 아래로 통과한 기록이 있어야 골인을 인정한다. 입구 위로 돌아오면 진입 기록을 지운다.710아래 판정선을 보정된 위치가 아래로 교차한 순서로 도착을 확정하고 같은 물리 단계도 교차 시각으로 정렬한다. 도착 구슬은 충돌에서 제거한다. 원통 진입 조건·순위별 힘·결승 정체 바람은 없다. 결승 이전8초 정체 바람과 모든 충돌은 유지한다. 핀 꼭대기 접촉·초당4 이하 속도·2px 이내 이동이1경기초 동안 이어지면 기존 바람 표시와 함께0.35경기초 동안 옆 방향 힘을 준다. 기울어진 쪽으로 밀고 정중앙에서는 경기 난수로 정한 방향을 사용한다. 접촉이 끊기거나 움직임이 커지면 정체 시간을 초기화한다. 동결 중과 결승 진입 후에는 적용하지 않는다. 충돌 판정과 핀 배치는 유지한다. 결승 벽의 그림·미니맵·충돌은 같은 직선 배치를 쓴다. 결승 구슬 접촉은 속도 처리와 위치 보정을 분리한다. 회전바와 밀집 보정의 이동선이 둥근 결승 벽을 가로지르면 첫 접점에서 벽 방향 이동·속도 성분을 제거한다. 새 반발력이나 효과음을 추가하지 않는다. 화면 보간이 둥근 통로 모서리 안으로 들어가면 표시 좌표만 벽 밖으로 보정한다. 결승 겹침은1/120초 물리 단계가 끝날 때 연결된 구슬 묶음과 벽·회전바를 함께 보정한다. 결승에 들어간 구슬과 연결된 이웃을 대상으로 하며 회전바 접촉이 없어도 검사한다.0.1초 대기는 제거한다. 미도착 구슬이64개를 넘으면 벽 보정 뒤 실제 남은 겹침이0.5 이하인지 확인해 조기 종료한다. 실제 위치 보정의 첫3회는 움직일 수 있는 두 구슬의 높이 차가 반지름 합의 절반보다 클 때 위쪽 구슬을 수직으로 먼저 분리한다. 그 뒤에는 기존 양쪽 분리를 사용하며 매회 벽·회전바와 남은 겹침을 다시 확인한다. 속도·반발 처리는 기존 방식을 유지하고 표시 보정에는 위쪽 우선 분리를 사용하지 않는다.64개 이하는 기존 보정 중 오차0.15 기준을 유지한다. 최대512차례와 실제·표시 겹침1 이하 검사 기준은 유지한다. 위치·속도 숫자 배열과 가까운 쌍·연결 정보·벽 후보를 재사용하며 이동량이 탐색 여유의 절반을 넘으면 후보를 다시 찾는다. 서로 파고드는 상대 속도만 제거하고 반발·효과음·스킬은 반복 적용하지 않는다. 보정 후 중앙 통로 진입과 골인을 판정한다. 회전바의 압력은 연결된 번개 구슬에도 전달하되 정지 시간과 자체 속도0을 유지한다. 얼음 고정과 도착 구슬은 이동시키지 않는다. 화면 보간도 같은 접촉 보정을 쓰며 실제 위치·속도·고정 기록·순위는 바꾸지 않는다. 200개 이상 경기의 결승에서는 기본 충돌이 반발 속도를 처리하고 단계 끝의 연결 접촉 처리가 위치 보정을 맡아 중복 벽 탐색을 줄인다. 이때 내부 이동 분할의 상한은4에서8로 조정하되 반지름13보다 작게 유지한다. 기본1/120초 물리 간격과 빠른 이동의 추가 분할은 유지한다. 결승 진입 뒤 큰 경기의 궤적은 달라질 수 있으나 같은 경기 시각의 배속별 결과는 같아야 한다. 블록 각도·크기와 구슬 주변 격자 범위를 재사용하고 회전·크기·격자·경기 변경 시 다시 계산한다.60개 밀집·각도4가지와1000개 밀집에서 실제·표시 겹침1 이하와 정상 골인을 검사한다.
  surface: [web]
  source: "사용자 구현 승인 2026-09-17 > 특수 구간·결승 연출·커스텀 맵과 대규모 참가 지원; 후속 선택 > 팡파레 사용·버터에 왁뿌볼 음원·연못에 기존 물풍선 음원·물풍선 장치 제거; 2026-09-18 크랙 왁스로 이름 변경·음원2개 교체·파괴 전 충돌음; 2026-09-18 화면·경기 길이·음향 개선 계획 구현 승인; 사용자 구현 승인 2026-09-19 > 이름표 항상 표시·모바일 버튼 줄바꿈·엇갈린 결승 회전판; 후속 사용자 선택 2026-09-19 > 윗 회전판 제거·입구 판의 위치와 길이로 되튕김 강화; 사용자 설계·구현 승인 2026-09-22 > 구슬 가시성·마지막 후보 추적·표시 보간·1000개 최적화·순위 전체 조회·왼쪽 곡면 개선; 사용자 설계·구현 승인 2026-09-22 > 파동180·양쪽 결승 원호·겹침 보정·번호 구슬 순위·전체 준비 화면·성능 분석; 사용자 선택 2026-09-22 > 스킬 렉 개선·순위6열·수평 기준20° 벽 유지와 회전바 위치 조정; 사용자 요청 2026-09-22 > 스킬음 축소·회전바 왼쪽 이동·순위 카드 별도 시안; 사용자 요청 2026-09-23 > 결승 회전 감속·경사 확대; 사용자 요청 2026-09-24 > 100개 블록 상한·종료 뒤 설정 수정 시 준비 복귀·마지막 구슬의 회전바 반복 걸림 해소; 후속 사용자 교정 2026-09-24 > 바 길이를 유지하고 위치와 결승 경사 조정; 후속 사용자 요청 > 회전축 오른쪽15 이동·통로 밖으로 밀어내기와 마지막 골인 양립; 사용자 요청 2026-09-25 > 회전바 길이를 조금 더 늘리기"
