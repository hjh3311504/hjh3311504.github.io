- id: REQ-QR-003
  text: QR 카드는 공용 Section·SectionHeader·EmptyState·Button을 사용한다. 주소 수정 때만 QR을 계산하고 제목 수정 때는 제목 준비와 지원 검사만 실행한다. 미리보기 QR은 최대 280px이며 캡션은 선택 가능한 HTML 텍스트로 즉시 표시한다. 제목은 공백을 포함해 보이는 글자 단위로 10자·한 줄이며 이모지·결합 문자와 한글 조합을 보존한다. 북마크 복원도 10자·한 줄을 검증한다. 캡션은 SUIT 700, 데스크톱 22px·모바일 20px를 기본으로 사용하며 넘칠 때만 글자를 줄인다. 캡션 영역은 데스크톱 48px·모바일 44px이며 빈 제목에도 유지하고 제목을 가로·세로 가운데 배치한다. 빈 상태에서는 QR 영역에 SVG 아이콘만, 캡션 영역에 ‘QR 코드가 여기에 나타납니다’만 각각 가운데 표시한다. 데스크톱 두 열의 전체 높이를 맞추고 북마크 목록은 내부에서 스크롤한다. 모바일은 독립된 높이로 세로 배치한다. QR 공간은 생성 상태로 바뀌지 않는다. 입력 하단 안내·입력 지우기·상시 상태 문구·북마크 저장 위치 배지·qr-feedback 고정 공간은 표시하지 않는다. 오류와 SVG 재시도는 필요할 때만 작업 버튼 아래에 표시하며 처리 중 버튼은 aria-busy와 중복 실행 방지를 적용한다. PNG·SVG·복사는 클릭 시 최종 이미지를 생성한다. 인쇄는 공용 Dialog에서 A4 세로 1장의 1열×1행·3열×4행·5열×6행 배열을 선택한다. 기본은 1개이며 페이지를 떠날 때까지 선택을 유지한다. 인쇄하기를 누른 순간의 QR·제목·배열로 PNG를 한 번 생성해 모든 칸에서 재사용한다. 여백 10mm·칸 간격 4mm·영역 190mm×276mm로 가운데 배치하고 1개는 최대 너비 140mm다. 각 인쇄 칸 전체에 검정 실선 0.2mm와 내부 여백 2mm를 칸 크기에 포함해 적용하며 다운로드에는 테두리를 넣지 않는다. 이미지 준비 실패는 선택 창에서 재시도하며 취소·닫기·Escape와 초점 복원을 지원한다. 출력 이미지의 너비는 1,024px, QR 영역 768px, 위 여백 32px이며 제목은 QR 아래 32px부터 SUIT 700·64px·줄 간격 88px·최대 너비 896px로 배치한다. 출력 제목은 한 줄이며 실제 글자 경계로 88px 영역의 가로·세로 가운데에 배치한다. 제목이 있으면 높이는 952px, 빈 제목은 832px다. PNG·SVG는 제목 배치와 윤곽선을 공유한다. SUIT에 없는 글자만 미리보기와 PNG에서 시스템 글꼴로 보완한다. SVG는 별도 QR·제목 벡터 그룹을 사용하며 미지원 글자·글꼴 실패는 SVG만 제한한다. 글꼴 재시도는 제목 처리만 다시 실행한다. 웹페이지 주소용 한 줄 input은 maxlength로 자르지 않고 전체 UTF-8 용량을 검사한다. 1,800바이트 초과 시 입력을 유지하고 생성·출력을 막는다. 줄바꿈이 있는 붙여넣기·드롭은 변형 전에 거절하며 기존 입력을 유지하고 오류를 표시한다. 주소 수정·유효한 붙여넣기·북마크 불러오기 뒤 재검사한다. 여러 줄 텍스트는 지원하지 않고 줄바꿈이 포함된 북마크는 복원하지 않는다.
  surface: [web]
  source: "사용자 승인 2026-09-11 > 공용 UI 정리와 제목 윤곽선을 포함한 SVG 저장 계획 구현; 추가 승인 > 미리보기 안정화, 생성 시점 분리와 SUIT 700 기본 사용; 제목 수정 시 지원 검사 선택; QR 미리보기와 두 열의 배치 정리 계획 구현; QR 여백 축소와 인쇄 배열 선택 계획 구현; QR 제목 10자 제한과 정렬·인쇄 테두리 정리 계획 구현"
  kind: crud
  ui: true
  design_status: approved
  design_ref: [screens/SCR-WEB-003.md]
  adr: docs/adr/2026-09-11-QR-SVG-제목은-윤곽선으로-저장.md
- id: REQ-WEB-028
  text: QR과 Team Maker는 같은 ToolPageHeader·ToolPageFooter와 항목 삭제 X 버튼 스타일을 사용한다. QR 작업 버튼은 PNG·SVG 저장, 이미지 복사·크게 보기, 북마크에 저장·인쇄 순서로 2개씩 3줄이며 SVG 저장은 보라색이다. QR 제목은 한글 조합 중인 마지막 글자도 즉시 미리보기에 표시하고 조합 중 입력창 값을 자르지 않는다. 미리보기·저장 제목은 최대 10자이며 조합 완료 시 입력창에도 제한을 적용한다. QR 안내 2개와 Team Maker 하단 안내 4개는 같은 DisclosureSection의 카드·제목 앞 CSS 삼각형·초점 스타일을 사용한다. 기본 마커를 숨기고 화살표와 텍스트를 세로 가운데 정렬하며 간격은 12px로 둔다. 안내는 기본 펼침 상태에서 독립적으로 접고 펼친다. Team Maker 주요 작업 영역에는 새 접기 기능을 추가하지 않는다. 번호가 있는 섹션 제목은 공통 26px 번호 배지·18px 제목·10px 간격으로 세로 가운데 맞춘다. QR 미리보기 배경·캡션·빈 상태는 테마를 따르며 스캔용 QR 사각형과 출력은 흰 바탕·검정 무늬를 유지한다. 북마크 X 버튼 오른쪽 여백은 8px다.
  surface: [web]
  source: "사용자 승인 2026-09-11 > QR 안내 디자인을 공통화하고 Team Maker 하단 안내에 적용; QR 제목 10자 제한과 정렬·인쇄 테두리 정리 계획 구현; 한글 조합 미리보기 수정·버튼 재배치·SVG 색상 변경·두 도구의 헤더·푸터·삭제 버튼 통일 요청"
  kind: crud
  ui: true
  design_status: approved
  design_ref: [screens/SCR-WEB-001.md, screens/SCR-WEB-003.md]
