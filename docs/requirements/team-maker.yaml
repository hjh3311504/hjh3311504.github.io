  text: 자동 테스트는 두 나누기 방식의 정확히 나눠지는 경우와 나머지가 있는 경우, 공백·줄바꿈·쉼표·중복 이름, 참가 제외, 같은 팀·다른 팀 규칙의 성공·충돌·배정 불가를 검증한다.
