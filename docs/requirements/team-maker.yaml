- id: REQ-QA-002
  text: 브라우저 검증은 참가자 편집, 명단 저장·덮어쓰기·불러오기·삭제, 다시 섞기, 승리·순위 지정·취소·기록 삭제, 당첨자 누적 추첨·바로 뽑기·효과음, 명단 복사, 오늘 기록 초기화, 참가자 통계, 전체 기록의 탭·정렬·검색, 새로고침 복구, 저장 실패, 모바일, 키보드와 하위 경로 자원 로드를 확인한다.
  surface: [qa]
  source: "원 요청 > 검증; 사용자 승인 handoff"
  kind: structural
- id: REQ-SCOPE-001
  text: 현재 화면은 능력치 모드, 주장 지정, 다국어, 후원, 공유 링크, 실제 광고, 루트 링크, 로그인, 서버 저장과 여러 기기 동기화를 제공하지 않는다.
