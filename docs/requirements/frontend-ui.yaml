- id: REQ-UI-002
  text: Codex와 Claude Code는 파일 수정 뒤 같은 UI 검사기를 실행하고 위반 위치·규칙·수정 방향을 다음 판단에 전달한다. 개발 서버와 PR 없이 새 파일과 shell 변경을 감지한다. 검사 기록은 세션별로 분리하고 같은 파일 내용의 반복 경고를 줄인다. 검사 실패를 정상 통과로 처리하지 않는다. 실제 hook 활성화는 설정 파일 작성과 구분하여 검증한다.
  surface: [tooling]
  source: "사용자 계획 구현 승인 2026-09-20 > 에이전트에게 직접 즉시 피드백"
  kind: structural
  adr: docs/adr/2026-09-20-공통-UI와-수정-직후-검사.md
