- id: REQ-BLOG-001
  text: /blog는 공개 글을 게시일 내림차순으로 표시한다. 제목은 블로그, 설명은 경험과 생각·일상을 다루는 일반 소개를 사용한다. 제목·요약·선택적 프로그램·종류·게시일을 표시한다. RSS 구독은 footer의 개인정보처리방침 옆에 같은 글자색·밑줄 스타일로 두고 본문의 홈 링크는 제공하지 않는다. 프로그램 선택은 제거한다. 오른쪽 사이드에 공개 글이 있는 카테고리와 글 수를 표시하고 모바일에서는 목록 위에 둔다. 목록 위의 글 수 문구는 제거한다. 페이지 숫자에 tnum을 적용한다. 글 목록은 페이지당6개로 나누고 하단에 이전·페이지 번호·다음 이동을 제공한다. 카테고리 변경은1페이지로 이동하며 선택과 페이지는 URL에 유지한다. 빈 목록·빈 카테고리를 구분한다. JavaScript 없이도 모든 공개 글에 접근할 수 있다.
  surface: [web]
  source: "사용자 구현 승인 2026-09-29 > 검토·보완한 블로그 전체 프롬프트대로 구현"
  kind: crud
