- id: REQ-BLOG-003
  text: content/blog의 Markdown을 서버 전용 코드에서 읽는다. 필수 정보·공개 여부·중복 slug·날짜·선택한 프로그램·종류·이미지 오류는 파일명과 원인을 표시하며 build를 실패시킨다. 날짜는 한국 시간으로 처리한다. 초안은 로컬에서만 미리 보고 배포 HTML·JavaScript·데이터·sitemap·RSS에서 제외한다. 주소는 제목과 독립적으로 유지한다.
