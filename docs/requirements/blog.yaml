- id: REQ-BLOG-002
  text: /blog/<slug>는 제목·요약·작성자·게시일·선택적 수정일과 프로그램이 연결된 글에만 프로그램 사용 링크를 제공한다. Markdown 본문 전체를 배경·테두리가 있는 공통 Section 카드 안에 표시해 다른 영역과 구분한다. 긴 글의 목차는 넓은 화면에서 본문 오른쪽에 고정하고 좁은 화면에서는 본문 위에 표시한다. 상단의 별도 목록 링크와 프로그램 사용 버튼을 제거하고 작성 정보 오른쪽에 뒤로가기를 둔다. 본문 카드 바깥 하단에 primary 색상의 프로그램 체험 버튼과 뒤로가기를 표시하고 footer와 구분선으로 나눈다. 작성 정보·버튼·구분선·footer는 목차를 제외한 본문 카드 너비에 맞춘다. 뒤로가기는 이전 내부 페이지로 연결하며 목차 이동은 돌아갈 주소를 바꾸지 않는다. 직접 접속·새로고침·JavaScript 비활성 상태에서는 블로그 목록으로 연결한다. 본문 이미지는 대체 텍스트와 함께 표시하며 단독 이미지의 선택적 캡션을 이미지 아래에 표시한다. 관련 공개 글을 제공하고 모바일 표·코드는 영역 안에서 스크롤한다. 업데이트에는 선택적 적용일·버전을 표시한다. 원시 HTML은 실행하지 않으며 없는 글은404다.
