- id: REQ-BLOG-004
  text: 공개 글마다 entries로 정적 HTML을 생성한다. 본문·canonical·검색 설명·공유 정보·BlogPosting은 같은 글 정보를 사용한다. 대표 이미지가 없으면 사이트 공통 이미지를 사용한다. RSS·sitemap은 공개 글만 포함하며 기존 도구 주소를 유지한다. 검색 등록과 AI 추천을 보장하지 않는다. 새 분석 도구·추적 항목·로그인·댓글·예약 발행은 추가하지 않는다.
