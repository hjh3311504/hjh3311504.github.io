<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicons/favicon-32x32.png"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/favicons/apple-touch-icon.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/favicons/site.webmanifest" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f4" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1918" />
		<script>
			// 화면을 그리기 전에 저장된 테마를 적용해 첫 화면의 깜빡임을 줄인다.
			(() => {
				let saved;
				try {
					saved = localStorage.getItem('juno.develog.theme');
				} catch {}
				document.documentElement.dataset.theme = ['light', 'dark'].includes(saved) ? saved : 'auto';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="svelte-root">%sveltekit.body%</div>
	</body>
</html>
