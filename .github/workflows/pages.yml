name: Check and deploy GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # UTC 15:17 = 한국 시간 다음 날 00:17. 예약 글은 이 build부터 공개된다.
    - cron: '17 15 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # PR은 새 commit이 오면 이전 검사를 취소한다. main 배포는 진행 중인 실행을 끝까지 마친다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site-build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        env:
          # PR은 외부로 전송하지 않는 예약 도메인·가짜 토큰로 수집 동작을 검사한다.
          PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ github.event_name == 'pull_request' && '00000000000000000000000000000000' || vars.PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
          PUBLIC_ANALYTICS_ORIGIN: ${{ github.event_name == 'pull_request' && 'https://analytics.example' || vars.PUBLIC_ANALYTICS_ORIGIN }}
        run: npm run build
      - name: Verify site output
        run: npm run verify:team-maker
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check UI rules
        run: npm run check:ui && npm run test:ui
      - name: Check SvelteKit
        run: npm run check
      - name: Test site logic
        # 오래 걸리는 구슬 레이스 물리 테스트는 marble-logic job에서 따로 실행한다.
        run: npm run test:logic
      - name: Test browser shard planner
        run: node --test tests/ci/*.test.js

  marble-logic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test marble race logic
        run: npm run test:marble-race

  marble-performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build tested site
        # site-build를 기다리지 않도록 같은 commit과 같은 PR 설정으로 직접 build한다.
        env:
          PUBLIC_CF_WEB_ANALYTICS_TOKEN: '00000000000000000000000000000000'
          PUBLIC_ANALYTICS_ORIGIN: 'https://analytics.example'
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Measure request-driven baseline on the same runner
        continue-on-error: true
        env:
          MARBLE_REQUEST_DRIVEN: '1'
        run: npm run test:e2e:built -- tests/team-maker-e2e/marble-performance.spec.js --retries=0
      - name: Save request-driven baseline
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: marble-request-driven-baseline
          path: output/playwright/report/
          retention-days: 7
      - name: Test marble performance and scheduling
        id: marble-performance
        run: npm run test:e2e:built -- --test-list tests/team-maker-e2e/marble-priority.txt
      - name: Save performance test report
        if: always() && github.event_name == 'pull_request' && (steps.marble-performance.outcome == 'success' || steps.marble-performance.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: marble-performance
          path: output/playwright/report/
          retention-days: 7
      - name: Measure failed marble performance
        if: failure() && github.event_name == 'pull_request' && steps.marble-performance.outcome == 'failure'
        env:
          MARBLE_PROFILE: '1'
        run: npm run test:e2e:built -- tests/team-maker-e2e/marble-performance.spec.js --retries=0
      - name: Save performance diagnostics
        if: failure() && github.event_name == 'pull_request' && steps.marble-performance.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: marble-diagnostics
          path: output/playwright/report/
          retention-days: 7
      - name: Trace failed mobile performance
        if: failure() && github.event_name == 'pull_request' && steps.marble-performance.outcome == 'failure'
        env:
          MARBLE_TRACE: '1'
        run: npm run test:e2e:built -- tests/team-maker-e2e/marble-performance.spec.js --grep '모바일.*1배속' --retries=0
      - name: Save mobile browser timeline
        if: failure() && github.event_name == 'pull_request' && steps.marble-performance.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: marble-mobile-trace
          path: output/playwright/report/
          retention-days: 7

  browser:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # scripts/plan_browser_shards.js의 shardCount와 같아야 한다.
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build tested site
        # site-build를 기다리지 않도록 같은 commit과 같은 PR 설정으로 직접 build한다.
        env:
          PUBLIC_CF_WEB_ANALYTICS_TOKEN: '00000000000000000000000000000000'
          PUBLIC_ANALYTICS_ORIGIN: 'https://analytics.example'
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Plan and verify browser shards
        run: node scripts/plan_browser_shards.js
      - name: Test site in browser
        # runner의 CPU 4개 중 2개씩 써서 파일 단위로 동시에 실행한다. 성능 측정 job은 1개씩 유지한다.
        run: npm run test:e2e:built -- --workers=2 --test-list output/playwright/shards/${{ matrix.shard }}.txt
      - name: Save browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.shard }}
          path: |
            output/playwright/report/
            output/playwright/shards/
          retention-days: 7

  # 기존 필수 검사 이름을 유지하고 실패·취소·예상 밖 생략을 성공으로 처리하지 않는다.
  build:
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    needs: [site-build, checks, marble-logic, marble-performance, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          SITE_RESULT: ${{ needs.site-build.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          MARBLE_LOGIC_RESULT: ${{ needs.marble-logic.result }}
          PERFORMANCE_RESULT: ${{ needs.marble-performance.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$SITE_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$CHECKS_RESULT" = success
            test "$MARBLE_LOGIC_RESULT" = success
            test "$PERFORMANCE_RESULT" = success
            test "$BROWSER_RESULT" = success
          fi

  deploy:
    if: always() && !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check public site URLs
        env:
          ROOT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$ROOT_URL" > /dev/null
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/team-maker")" = "200"
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/qr-code")" = "200"
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/marble-race")" = "200"
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/bracket")" = "200"
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/aram-mayhem")" = "200"
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/aram-mayhem/master-yi")" = "200"
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/aram-mayhem/augments/armored-impact")" = "200"
          for route in blog rss.xml sitemap.xml; do
            test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/$route")" = "200"
          done
