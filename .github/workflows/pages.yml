name: Check and deploy GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        if: github.event_name == 'pull_request'
        run: npm run lint
      - name: Check UI rules
        if: github.event_name == 'pull_request'
        run: npm run check:ui && npm run test:ui
      - name: Check SvelteKit
        if: github.event_name == 'pull_request'
        run: npm run check
      - name: Test site logic
        if: github.event_name == 'pull_request'
        run: npm test
      - name: Install Playwright Chromium
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Build site
        run: npm run build
      - name: Measure request-driven baseline on the same runner
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          MARBLE_REQUEST_DRIVEN: '1'
        run: npm run test:e2e:built -- tests/team-maker-e2e/marble-performance.spec.js --retries=0
      - name: Save request-driven baseline
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: marble-request-driven-baseline
          path: output/playwright/report/
          retention-days: 7
      - name: Test marble performance and scheduling
        id: marble-performance
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:built -- --test-list tests/team-maker-e2e/marble-priority.txt
      - name: Save performance test report
        if: always() && github.event_name == 'pull_request' && (steps.marble-performance.outcome == 'success' || steps.marble-performance.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: marble-performance
          path: output/playwright/report/
          retention-days: 7
      - name: Measure failed marble performance
        if: failure() && github.event_name == 'pull_request' && steps.marble-performance.outcome == 'failure'
        env:
          MARBLE_PROFILE: '1'
        run: npm run test:e2e:built -- tests/team-maker-e2e/marble-performance.spec.js --retries=0
      - name: Save performance diagnostics
        if: failure() && github.event_name == 'pull_request' && steps.marble-performance.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: marble-diagnostics
          path: output/playwright/report/
          retention-days: 7
      - name: Test remaining site in browser
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:built -- --test-list-invert tests/team-maker-e2e/marble-priority.txt
      - name: Verify site output
        run: npm run verify:team-maker
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check public tool URLs
        env:
          ROOT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$ROOT_URL" > /dev/null
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/team-maker")" = "200"
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/qr-code")" = "200"
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/marble-race")" = "200"
