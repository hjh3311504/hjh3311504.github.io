name: Check and deploy GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        if: github.event_name == 'pull_request'
        run: npm run lint
      - name: Check UI rules
        if: github.event_name == 'pull_request'
        run: npm run check:ui && npm run test:ui
      - name: Check SvelteKit
        if: github.event_name == 'pull_request'
        run: npm run check
      - name: Test site logic
        if: github.event_name == 'pull_request'
        run: npm test
      - name: Install Playwright Chromium
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Build site
        run: npm run build
      - name: Test site in browser
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:built
      - name: Verify site output
        run: npm run verify:team-maker
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check public tool URLs
        env:
          ROOT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$ROOT_URL" > /dev/null
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/team-maker")" = "200"
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/qr-code")" = "200"
          test "$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --output /dev/null --write-out '%{http_code}' "${ROOT_URL%/}/marble-race")" = "200"
